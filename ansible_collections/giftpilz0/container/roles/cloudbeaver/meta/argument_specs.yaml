---
argument_specs:
  main:
    short_description: Deploy the CloudBeaver database management web app as a Podman quadlet.
    options:
      podman_user:
        type: str
        required: false
        default: "{{ ansible_user }}"
        description: system user for rootless podman operations.

      cloudbeaver_proxy_enabled:
        type: bool
        required: false
        default: false
        description: enable HTTP proxy for image pulls.

      cloudbeaver_proxy_http:
        type: str
        required: false
        default: ""
        description: HTTP proxy URL.

      cloudbeaver_proxy_https:
        type: str
        required: false
        default: ""
        description: HTTPS proxy URL.

      cloudbeaver_proxy_no_proxy:
        type: str
        required: false
        default: ""
        description: comma-separated list of proxy exclusions.

      cloudbeaver_network_enabled:
        type: bool
        required: false
        default: true
        description: create and manage the podman network.

      cloudbeaver_network_driver:
        type: str
        required: false
        default: bridge
        description: podman network driver.

      cloudbeaver_network_name:
        type: str
        required: false
        default: cloudbeaver-internal
        description: podman network name.

      cloudbeaver_db_network_name:
        type: str
        required: false
        default: ""
        description: existing database network to join instead of creating one.

      cloudbeaver_bind_ip:
        type: str
        required: false
        default: "127.0.0.1"
        description: host IP to bind exposed ports to.

      cloudbeaver_port_map_enabled:
        type: bool
        required: false
        default: true
        description: expose container ports on the host.

      cloudbeaver_port_map:
        type: list
        elements: str
        required: false
        default:
          - "8978:8978"
        description: host:container port mappings.

      cloudbeaver_version:
        type: str
        required: false
        default: "26.1.5"
        description: container image version.

      cloudbeaver_autoupdate:
        type: bool
        required: false
        default: true
        description: enable podman auto-update for this container.

      cloudbeaver_server_name:
        type: str
        required: false
        default: CloudBeaver
        description: server display name.

      cloudbeaver_admin_user:
        type: str
        required: false
        default: cbadmin
        description: admin username.

      cloudbeaver_admin_password:
        type: str
        required: false
        default: ""
        description: admin password.

      cloudbeaver_environment_vars:
        type: dict
        required: false
        default: {}
        description: extra environment variables injected into the container.

      cloudbeaver_db_type:
        type: str
        required: false
        default: postgresql
        description: database backend type.

      cloudbeaver_db_host:
        type: str
        required: false
        default: localhost
        description: database host.

      cloudbeaver_db_port:
        type: str
        required: false
        default: "5432"
        description: database port.

      cloudbeaver_db_name:
        type: str
        required: false
        default: ""
        description: database name.

      cloudbeaver_db_user:
        type: str
        required: false
        default: ""
        description: database user.

      cloudbeaver_db_password:
        type: str
        required: false
        default: ""
        description: database password.

      cloudbeaver_extra_files:
        type: list
        elements: dict
        required: false
        default: []
        description: list of arbitrary files to copy into the role quadlet directory. Each entry has src (controller path), dest (relative path inside the pod
          quadlet dir) and optional mount (container bind-mount path).

      cloudbeaver_extra_dirs:
        type: list
        elements: dict
        required: false
        default: []
        description: list of arbitrary directories to copy into the role quadlet directory. Each entry has src (controller directory), dest (relative target
          directory inside the pod quadlet dir) and optional mount (container bind-mount path).
