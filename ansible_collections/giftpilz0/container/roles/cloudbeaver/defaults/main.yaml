---
podman_user: "{{ ansible_user }}"

# Proxy
cloudbeaver_proxy_enabled: false
cloudbeaver_proxy_http: ""
cloudbeaver_proxy_https: ""
cloudbeaver_proxy_no_proxy: ""
cloudbeaver_proxy_env: "{{ (['https_proxy=' ~ cloudbeaver_proxy_https] + (['http_proxy=' ~ cloudbeaver_proxy_http] if cloudbeaver_proxy_http else []) + (['no_proxy='
  ~ cloudbeaver_proxy_no_proxy] if cloudbeaver_proxy_no_proxy else [])) if cloudbeaver_proxy_enabled else [] }}"

# Network
cloudbeaver_network_enabled: true
cloudbeaver_network_driver: "bridge"
cloudbeaver_network_internal: false

# When deployed standalone, CloudBeaver uses its own network. When a database
# network is supplied, CloudBeaver uses that network instead.
cloudbeaver_network_name: "cloudbeaver-internal"
cloudbeaver_db_network_name: ""

# Optional: expose this service directly on the host, bypassing Traefik.
# Not required for Traefik to reach it -- Traefik connects directly over the
# shared Podman network using the container name and container port.
# _bind_ip and _port_map are independent: override _bind_ip alone to change
# where it's exposed, or _port_map alone ("host_port:container_port") to
# change which ports -- no need to redefine both together.
cloudbeaver_bind_ip: "127.0.0.1"
cloudbeaver_port_map_enabled: true
cloudbeaver_port_map:
  - "8978:8978"

# renovate: datasource=docker depName=dbeaver/cloudbeaver
cloudbeaver_version: "26.1.3"

cloudbeaver_autoupdate: true

# CloudBeaver admin credentials (set on first boot via auto-config)
cloudbeaver_server_name: "CloudBeaver"
cloudbeaver_admin_user: "cbadmin"
cloudbeaver_admin_password: ""

# Environment
cloudbeaver_environment_vars:
  CB_SERVER_NAME: "{{ cloudbeaver_server_name }}"
  CB_ADMIN_NAME: "{{ cloudbeaver_admin_user }}"
  CB_ADMIN_PASSWORD: "{{ cloudbeaver_admin_password }}"
  CLOUDBEAVER_APP_ANONYMOUS_ACCESS_ENABLED: "false"
  CLOUDBEAVER_APP_SUPPORTS_CUSTOM_CONNECTIONS: "true"
  CLOUDBEAVER_APP_PUBLIC_CREDENTIALS_SAVE_ENABLED: "true"

# Database connection (passed by parent role)
cloudbeaver_db_type: "postgresql"
cloudbeaver_db_host: "localhost"
cloudbeaver_db_port: "5432"
cloudbeaver_db_name: ""
cloudbeaver_db_user: ""
cloudbeaver_db_password: ""
