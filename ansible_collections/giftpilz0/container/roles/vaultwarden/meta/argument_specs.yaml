---
argument_specs:
  main:
    short_description: Deploy Vaultwarden (Bitwarden-compatible password manager) as a Podman quadlet.
    options:
      podman_user:
        type: str
        required: false
        default: "{{ ansible_user }}"
        description: system user for rootless podman operations.

      vaultwarden_proxy_enabled:
        type: bool
        required: false
        default: false
        description: enable HTTP proxy for image pulls.

      vaultwarden_proxy_http:
        type: str
        required: false
        default: ""
        description: HTTP proxy URL.

      vaultwarden_proxy_https:
        type: str
        required: false
        default: ""
        description: HTTPS proxy URL.

      vaultwarden_proxy_no_proxy:
        type: str
        required: false
        default: ""
        description: comma-separated list of proxy exclusions.

      vaultwarden_proxy_env:
        type: list
        elements: str
        required: false
        default: []
        description: generated proxy environment entries.

      vaultwarden_network_enabled:
        type: bool
        required: false
        default: true
        description: create and manage the podman network.

      vaultwarden_network_driver:
        type: str
        required: false
        default: bridge
        description: podman network driver.

      vaultwarden_network_name:
        type: str
        required: false
        default: vaultwarden-internal
        description: podman network name.

      vaultwarden_bind_ip:
        type: str
        required: false
        default: "127.0.0.1"
        description: host IP to bind exposed ports to.

      vaultwarden_port_map_enabled:
        type: bool
        required: false
        default: true
        description: expose container ports on the host.

      vaultwarden_port_map:
        type: list
        elements: str
        required: false
        default:
          - "80:80"
        description: host:container port mappings.

      vaultwarden_version:
        type: str
        required: false
        default: "1.37.2-alpine"
        description: container image version.

      vaultwarden_autoupdate:
        type: bool
        required: false
        default: true
        description: enable podman auto-update for this container.

      vaultwarden_domain:
        type: str
        required: false
        default: ""
        description: external URL for the Vaultwarden instance.

      vaultwarden_admin_token:
        type: str
        required: false
        default: ""
        description: admin token for the Vaultwarden admin panel.

      vaultwarden_environment_vars:
        type: dict
        required: false
        default: {}
        description: extra environment variables injected into the container.

      vaultwarden_extra_files:
        type: list
        elements: dict
        required: false
        default: []
        description: arbitrary file entries with src (controller path) or source (target path), dest, optional mount, mode, and template.

      vaultwarden_extra_dirs:
        type: list
        elements: dict
        required: false
        default: []
        description: arbitrary directory entries with src (controller directory) or source (target path), dest, optional mount and mode.

      vaultwarden_entrypoint:
        type: str
        required: false
        default: ""
        description: optional container entrypoint override.
