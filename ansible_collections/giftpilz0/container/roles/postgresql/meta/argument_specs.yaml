---
argument_specs:
  main:
    short_description: Deploy PostgreSQL as a Podman quadlet.
    options:
      podman_user:
        type: str
        required: false
        default: "{{ ansible_user }}"
        description: system user for rootless podman operations.

      postgresql_network_enabled:
        type: bool
        required: false
        default: true
        description: create and manage the podman network.

      postgresql_network_name:
        type: str
        required: false
        default: postgresql-internal
        description: podman network name.

      postgresql_bind_ip:
        type: str
        required: false
        default: "127.0.0.1"
        description: host IP to bind exposed ports to.

      postgresql_port_map_enabled:
        type: bool
        required: false
        default: false
        description: expose container ports on the host.

      postgresql_port_map:
        type: list
        elements: str
        required: false
        default:
          - "5432:5432"
        description: host:container port mappings.

      postgresql_version:
        type: str
        required: false
        default: "18.6-alpine"
        description: container image version.

      postgresql_autoupdate:
        type: bool
        required: false
        default: true
        description: enable podman auto-update for PostgreSQL.

      postgresql_backup_autoupdate:
        type: bool
        required: false
        default: true
        description: enable podman auto-update for the backup container.

      postgresql_db_name:
        type: str
        required: false
        default: postgres
        description: name of the default database to create.

      postgresql_db_user:
        type: str
        required: false
        default: postgres
        description: name of the default database user.

      postgresql_db_password:
        type: str
        required: false
        default: ""
        description: password for the default database user.

      postgresql_backup_schedule_times:
        type: str
        required: false
        default: "03:00"
        description: time of day to run backup (HH:MM format).

      postgresql_backup_retention_days:
        type: int
        required: false
        default: 7
        description: number of days to keep backups.

      postgresql_backup_compression:
        type: int
        required: false
        default: 6
        description: gzip compression level (1-9).

      postgresql_cloudbeaver_enabled:
        type: bool
        required: false
        default: false
        description: deploy CloudBeaver management UI alongside PostgreSQL.

      postgresql_cloudbeaver_admin_user:
        type: str
        required: false
        default: cbadmin
        description: CloudBeaver admin username.

      postgresql_cloudbeaver_admin_password:
        type: str
        required: false
        default: ""
        description: CloudBeaver admin password.

      postgresql_extra_files:
        type: list
        elements: dict
        required: false
        default: []
        description: list of arbitrary files to copy into the role quadlet directory. Each entry has src (controller path), dest (relative path inside the pod
          quadlet dir) and optional mount (container bind-mount path).

      postgresql_extra_dirs:
        type: list
        elements: dict
        required: false
        default: []
        description: list of arbitrary directories to copy into the role quadlet directory. Each entry has src (controller directory), dest (relative target
          directory inside the pod quadlet dir) and optional mount (container bind-mount path).

      postgresql_proxy_enabled:
        type: bool
        required: false
        default: false
        description: enable HTTP proxy for image pulls.

      postgresql_proxy_http:
        type: str
        required: false
        default: ""
        description: HTTP proxy URL.

      postgresql_proxy_https:
        type: str
        required: false
        default: ""
        description: HTTPS proxy URL.

      postgresql_proxy_no_proxy:
        type: str
        required: false
        default: ""
        description: comma-separated list of proxy exclusions.

      postgresql_network_driver:
        type: str
        required: false
        default: bridge
        description: podman network driver.

      postgresql_environment_vars:
        type: dict
        required: false
        default:
          POSTGRES_DB: "{{ postgresql_db_name }}"
          POSTGRES_USER: "{{ postgresql_db_user }}"
          POSTGRES_PASSWORD: "{{ postgresql_db_password }}"
        description: extra environment variables for the container.
