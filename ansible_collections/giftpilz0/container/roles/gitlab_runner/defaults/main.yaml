---
## Primary
podman_user: "{{ ansible_user }}"

# Image
gitlab_runner_image: "docker.io/gitlab/gitlab-runner"
# renovate: datasource=docker depName=gitlab/gitlab-runner
gitlab_runner_version: "v19.5.2"
gitlab_runner_autoupdate: true

# Network (always joined, created only when enabled)
gitlab_runner_network_enabled: true
gitlab_runner_network_name: "gitlab-runner-internal"
gitlab_runner_network_driver: "bridge"

## Service
# Docker executor against the rootless Podman socket
gitlab_runner_concurrent: 1
gitlab_runner_name: ""
gitlab_runner_url: ""
gitlab_runner_token: ""

# Environment
gitlab_runner_environment_vars: {}

## Advanced
gitlab_runner_entrypoint: ""

# Extra inventory files/dirs, format: see quadlet defaults
gitlab_runner_extra_files: []
gitlab_runner_extra_dirs: []
