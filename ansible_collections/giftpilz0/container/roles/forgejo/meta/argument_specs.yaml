---
argument_specs:
  main:
    short_description: Deploy the Forgejo Git service as a Podman quadlet.
    options:
      podman_user:
        type: str
        required: false
        description: System user for rootless podman operations.

      forgejo_image:
        type: str
        required: false
        description: Image name without tag.

      forgejo_version:
        type: str
        required: false
        description: Container image version.

      forgejo_autoupdate:
        type: bool
        required: false
        description: Enable podman auto-update for this container.

      forgejo_network_enabled:
        type: bool
        required: false
        description: Create and manage the podman network.

      forgejo_network_name:
        type: str
        required: false
        description: Podman network name.

      forgejo_network_driver:
        type: str
        required: false
        description: Podman network driver.

      forgejo_port_map_enabled:
        type: bool
        required: false
        description: Expose container ports on the host.

      forgejo_bind_ip:
        type: str
        required: false
        description: Host IP to bind exposed ports to.

      forgejo_port_map:
        type: list
        elements: str
        required: false
        description: Host:container port mappings.

      forgejo_domain:
        type: str
        required: false
        description: External domain for the Forgejo instance.

      forgejo_ssh_port:
        type: int
        required: false
        description: host port of the git SSH server, shown in clone URLs.

      forgejo_log_level:
        type: str
        required: false
        description: Forgejo log level.

      forgejo_db_host:
        type: str
        required: false
        description: PostgreSQL container hostname.

      forgejo_db_name:
        type: str
        required: false
        description: Database name.

      forgejo_db_user:
        type: str
        required: false
        description: Database user.

      forgejo_db_password:
        type: str
        required: false
        description: Database user password.

      forgejo_oauth_name:
        type: str
        required: false
        description: OAuth2 provider display name.

      forgejo_oauth_domain:
        type: str
        required: false
        description: OAuth2 provider domain.

      forgejo_oauth_client_id:
        type: str
        required: false
        description: OAuth2 client ID for external authentication.

      forgejo_oauth_client_secret:
        type: str
        required: false
        description: OAuth2 client secret.

      forgejo_oauth_admin_group:
        type: str
        required: false
        description: OAuth2 group that grants admin access.

      forgejo_environment_vars:
        type: dict
        required: false
        description: Extra environment variables injected into the container.

      forgejo_entrypoint:
        type: str
        required: false
        description: Optional Forgejo container entrypoint override.

      forgejo_oauth_init_entrypoint:
        type: str
        required: false
        description: Optional Forgejo OAuth initialization container entrypoint override.

      forgejo_extra_files:
        type: list
        elements: dict
        required: false
        description: Arbitrary file entries with src (controller path) or source (target path), dest, optional mount, mode, and template.

      forgejo_extra_dirs:
        type: list
        elements: dict
        required: false
        description: Arbitrary directory entries with src (controller directory) or source (target path), dest, optional mount and mode.
