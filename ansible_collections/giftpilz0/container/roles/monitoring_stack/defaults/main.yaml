---
## Primary
podman_user: "{{ ansible_user }}"

# Images
monitoring_stack_garage_image: "docker.io/dxflrs/garage"
# renovate: datasource=docker depName=dxflrs/garage
monitoring_stack_garage_version: "v2.4.1"
monitoring_stack_garage_autoupdate: true
monitoring_stack_mimir_image: "docker.io/grafana/mimir"
# renovate: datasource=docker depName=grafana/mimir
monitoring_stack_mimir_version: "3.2.3"
monitoring_stack_mimir_autoupdate: true
monitoring_stack_loki_image: "docker.io/grafana/loki"
# renovate: datasource=docker depName=grafana/loki
monitoring_stack_loki_version: "3.7.9"
monitoring_stack_loki_autoupdate: true
monitoring_stack_perses_image: "docker.io/persesdev/perses"
# renovate: datasource=docker depName=persesdev/perses
monitoring_stack_perses_version: "v0.55.0-rc.1"
monitoring_stack_perses_autoupdate: true

# Network (always joined, created only when enabled)
monitoring_stack_network_enabled: true
monitoring_stack_network_name: "monitoring-stack-internal"
monitoring_stack_network_driver: "bridge"

# Host ports (not needed behind Traefik)
monitoring_stack_port_map_enabled: false
monitoring_stack_bind_ip: "127.0.0.1"
monitoring_stack_port_map: []

## Service
# GarageHQ (https://garagehq.deuxfleurs.fr/documentation/reference-manual/configuration/)
monitoring_stack_garage_rpc_secret: "" # openssl rand -hex 32
monitoring_stack_garage_admin_token: "" # openssl rand -base64 32
monitoring_stack_garage_metrics_token: "" # openssl rand -base64 32
monitoring_stack_garage_region: "garage"

monitoring_stack_garage_rpc_port: 3901
monitoring_stack_garage_s3_api_port: 3900
monitoring_stack_garage_web_port: 3902
monitoring_stack_garage_admin_port: 3903

monitoring_stack_garage_mimir_bucket: "mimir"
monitoring_stack_garage_loki_bucket: "loki"

monitoring_stack_garage_storage_capacity: "100G"

# One-time setup of layout, buckets and keys (first deployment only)
monitoring_stack_garage_init: false

# S3 keys, printed by the garage init
monitoring_stack_mimir_access_key_id: ""
monitoring_stack_mimir_secret_access_key: ""

monitoring_stack_loki_access_key_id: ""
monitoring_stack_loki_secret_access_key: ""

# Mimir (https://grafana.com/docs/mimir/latest/configure/configuration-parameters/)
monitoring_stack_mimir_http_port: 9009
monitoring_stack_mimir_grpc_port: 9095
monitoring_stack_mimir_log_level: "warn"
monitoring_stack_mimir_ingestion_rate: 100000
monitoring_stack_mimir_max_global_series_per_user: 10000000
monitoring_stack_mimir_out_of_order_time_window: "1h"

# Loki (https://grafana.com/docs/loki/latest/configure/)
monitoring_stack_loki_http_port: 3100
monitoring_stack_loki_grpc_port: 9096
monitoring_stack_loki_log_level: "warn"

# Perses (https://perses.dev/perses/docs/)
monitoring_stack_perses_http_port: 8080
monitoring_stack_perses_oidc_enabled: true
monitoring_stack_perses_oidc_client_id: perses
monitoring_stack_perses_oidc_client_secret: ""
monitoring_stack_perses_oidc_issuer: "https://login.nixpi.de/realms/nixpi"
monitoring_stack_perses_external_url: "https://monitoring.nixpi.de"

# Push basic auth (bcrypt hashes) for the Traefik middlewares
monitoring_stack_loki_basic_auth_user: alloy
monitoring_stack_loki_basic_auth_hash: ""
monitoring_stack_mimir_basic_auth_user: alloy
monitoring_stack_mimir_basic_auth_hash: ""

# Environment
monitoring_stack_mimir_environment_vars:
  GOMAXPROCS: "2"
monitoring_stack_loki_environment_vars:
  GOMAXPROCS: "2"
monitoring_stack_perses_environment_vars: {}

## Advanced
monitoring_stack_garage_entrypoint: ""
monitoring_stack_mimir_entrypoint: ""
monitoring_stack_loki_entrypoint: ""
monitoring_stack_perses_entrypoint: ""

# Extra inventory files/dirs, format: see quadlet defaults
monitoring_stack_extra_files: []
monitoring_stack_extra_dirs: []
