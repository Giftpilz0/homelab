# Perses provisioning – Mimir global datasource
# Docs: https://perses.dev/perses/docs/api/datasource/
kind: GlobalDatasource
metadata:
  name: mimir
spec:
  default: true
  plugin:
    kind: PrometheusDatasource
    spec:
      proxy:
        kind: HTTPProxy
        spec:
          url: "http://127.0.0.1:{{ monitoring_stack_mimir_http_port }}/prometheus"
