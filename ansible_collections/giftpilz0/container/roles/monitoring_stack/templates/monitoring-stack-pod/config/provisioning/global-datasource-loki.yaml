# Perses provisioning – Loki global datasource
# Docs: https://perses.dev/perses/docs/api/datasource/
kind: GlobalDatasource
metadata:
  name: loki
spec:
  default: true
  plugin:
    kind: LokiDatasource
    spec:
      proxy:
        kind: HTTPProxy
        spec:
          url: "http://127.0.0.1:{{ monitoring_stack_loki_http_port }}"
