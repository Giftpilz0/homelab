---
argument_specs:
  main:
    short_description: Deploy the monitoring stack (Garage object store, Mimir, Loki, and Perses UI) as Podman quadlets.
    options:
      podman_user:
        type: str
        required: false
        description: System user for rootless podman operations.

      monitoring_stack_garage_image:
        type: str
        required: false
        description: Image name without tag.

      monitoring_stack_garage_version:
        type: str
        required: false
        description: GarageHQ container image version.

      monitoring_stack_garage_autoupdate:
        type: bool
        required: false
        description: Enable podman auto-update for GarageHQ.

      monitoring_stack_mimir_image:
        type: str
        required: false
        description: Image name without tag.

      monitoring_stack_mimir_version:
        type: str
        required: false
        description: Mimir container image version.

      monitoring_stack_mimir_autoupdate:
        type: bool
        required: false
        description: Enable podman auto-update for Mimir.

      monitoring_stack_loki_image:
        type: str
        required: false
        description: Image name without tag.

      monitoring_stack_loki_version:
        type: str
        required: false
        description: Loki container image version.

      monitoring_stack_loki_autoupdate:
        type: bool
        required: false
        description: Enable podman auto-update for Loki.

      monitoring_stack_perses_image:
        type: str
        required: false
        description: Image name without tag.

      monitoring_stack_perses_version:
        type: str
        required: false
        description: Perses container image version.

      monitoring_stack_perses_autoupdate:
        type: bool
        required: false
        description: Enable podman auto-update for Perses.

      monitoring_stack_network_enabled:
        type: bool
        required: false
        description: Create and manage the podman network.

      monitoring_stack_network_name:
        type: str
        required: false
        description: Podman network name.

      monitoring_stack_network_driver:
        type: str
        required: false
        description: Podman network driver.

      monitoring_stack_port_map_enabled:
        type: bool
        required: false
        description: Expose container ports on the host.

      monitoring_stack_bind_ip:
        type: str
        required: false
        description: Host IP to bind exposed ports to.

      monitoring_stack_port_map:
        type: list
        elements: str
        required: false
        description: Host:container port mappings.

      monitoring_stack_garage_rpc_secret:
        type: str
        required: false
        description: GarageHQ RPC secret (openssl rand -hex 32).

      monitoring_stack_garage_admin_token:
        type: str
        required: false
        description: GarageHQ admin token (openssl rand -base64 32).

      monitoring_stack_garage_metrics_token:
        type: str
        required: false
        description: GarageHQ metrics token (openssl rand -base64 32).

      monitoring_stack_garage_region:
        type: str
        required: false
        description: GarageHQ region name.

      monitoring_stack_garage_rpc_port:
        type: int
        required: false
        description: GarageHQ internal RPC port.

      monitoring_stack_garage_s3_api_port:
        type: int
        required: false
        description: GarageHQ S3 API port.

      monitoring_stack_garage_web_port:
        type: int
        required: false
        description: GarageHQ web UI port.

      monitoring_stack_garage_admin_port:
        type: int
        required: false
        description: GarageHQ admin port.

      monitoring_stack_garage_mimir_bucket:
        type: str
        required: false
        description: S3 bucket name for Mimir.

      monitoring_stack_garage_loki_bucket:
        type: str
        required: false
        description: S3 bucket name for Loki.

      monitoring_stack_garage_storage_capacity:
        type: str
        required: false
        description: Storage capacity hint for layout assignment.

      monitoring_stack_garage_init:
        type: bool
        required: false
        description: Run GarageHQ one-time initialization (set true on first deploy).

      monitoring_stack_mimir_access_key_id:
        type: str
        required: false
        description: Mimir S3 access key ID for GarageHQ.

      monitoring_stack_mimir_secret_access_key:
        type: str
        required: false
        description: Mimir S3 secret access key for GarageHQ.

      monitoring_stack_loki_access_key_id:
        type: str
        required: false
        description: Loki S3 access key ID for GarageHQ.

      monitoring_stack_loki_secret_access_key:
        type: str
        required: false
        description: Loki S3 secret access key for GarageHQ.

      monitoring_stack_mimir_http_port:
        type: int
        required: false
        description: Mimir HTTP port inside the container.

      monitoring_stack_mimir_grpc_port:
        type: int
        required: false
        description: Mimir gRPC port inside the container.

      monitoring_stack_mimir_log_level:
        type: str
        required: false
        description: Mimir log level.

      monitoring_stack_mimir_ingestion_rate:
        type: int
        required: false
        description: Mimir ingestion rate limit.

      monitoring_stack_mimir_max_global_series_per_user:
        type: int
        required: false
        description: Mimir max global series per user.

      monitoring_stack_mimir_out_of_order_time_window:
        type: str
        required: false
        description: Mimir out-of-order ingestion time window.

      monitoring_stack_loki_http_port:
        type: int
        required: false
        description: Loki HTTP port inside the container.

      monitoring_stack_loki_grpc_port:
        type: int
        required: false
        description: Loki gRPC port inside the container.

      monitoring_stack_loki_log_level:
        type: str
        required: false
        description: Loki log level.

      monitoring_stack_perses_http_port:
        type: int
        required: false
        description: Perses HTTP port inside the container.

      monitoring_stack_perses_oidc_enabled:
        type: bool
        required: false
        description: Enable OIDC authentication for Perses.

      monitoring_stack_perses_oidc_client_id:
        type: str
        required: false
        description: OIDC client ID for Perses.

      monitoring_stack_perses_oidc_client_secret:
        type: str
        required: false
        description: OIDC client secret for Perses.

      monitoring_stack_perses_oidc_issuer:
        type: str
        required: false
        description: OIDC issuer URL for Perses.

      monitoring_stack_perses_external_url:
        type: str
        required: false
        description: Browser-facing URL for the monitoring stack.

      monitoring_stack_loki_basic_auth_user:
        type: str
        required: false
        description: Basic auth username for Loki (Alloy scraping).

      monitoring_stack_loki_basic_auth_hash:
        type: str
        required: false
        description: Bcrypt hash for Loki basic auth password.

      monitoring_stack_mimir_basic_auth_user:
        type: str
        required: false
        description: Basic auth username for Mimir (Alloy scraping).

      monitoring_stack_mimir_basic_auth_hash:
        type: str
        required: false
        description: Bcrypt hash for Mimir basic auth password.

      monitoring_stack_mimir_environment_vars:
        type: dict
        required: false
        description: Extra environment variables for Mimir.

      monitoring_stack_loki_environment_vars:
        type: dict
        required: false
        description: Extra environment variables for Loki.

      monitoring_stack_perses_environment_vars:
        type: dict
        required: false
        description: Extra environment variables for Perses.

      monitoring_stack_garage_entrypoint:
        type: str
        required: false
        description: Optional GarageHQ container entrypoint override.

      monitoring_stack_mimir_entrypoint:
        type: str
        required: false
        description: Optional Mimir container entrypoint override.

      monitoring_stack_loki_entrypoint:
        type: str
        required: false
        description: Optional Loki container entrypoint override.

      monitoring_stack_perses_entrypoint:
        type: str
        required: false
        description: Optional Perses container entrypoint override.

      monitoring_stack_extra_files:
        type: list
        elements: dict
        required: false
        description: Arbitrary file entries with src (controller path) or source (target path), dest, optional mount, mode, and template.

      monitoring_stack_extra_dirs:
        type: list
        elements: dict
        required: false
        description: Arbitrary directory entries with src (controller directory) or source (target path), dest, optional mount and mode.
