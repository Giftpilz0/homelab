---
# Layout, buckets and keys (https://garagehq.deuxfleurs.fr/documentation/reference-manual/cli/)

- name: "Monitoring Stack: GarageHQ - Wait for GarageHQ to be ready"
  become: true
  become_user: "{{ podman_user }}"
  ansible.builtin.command:
    cmd: podman exec garage /garage status
  register: _garage_ready
  until: _garage_ready.rc == 0
  retries: 20
  delay: 5
  changed_when: false

- name: "Monitoring Stack: GarageHQ - Get node ID from status"
  become: true
  become_user: "{{ podman_user }}"
  ansible.builtin.command:
    cmd: podman exec garage /garage status
  register: _garage_status
  changed_when: false

- name: "Monitoring Stack: GarageHQ - Set node ID fact"
  ansible.builtin.set_fact:
    _monitoring_stack_garage_node_id: "{{ (_garage_status.stdout_lines | select('match', '^[0-9a-f]{16}') | first).split()[0] }}"

- name: "Monitoring Stack: GarageHQ - Check existing layout"
  become: true
  become_user: "{{ podman_user }}"
  ansible.builtin.command:
    cmd: podman exec garage /garage layout show
  register: _garage_layout
  changed_when: false

- name: "Monitoring Stack: GarageHQ - Assign single-node layout"
  become: true
  become_user: "{{ podman_user }}"
  ansible.builtin.command:
    cmd: >
      podman exec garage /garage layout assign
      -z dc1
      -c {{ monitoring_stack_garage_storage_capacity }}
      {{ _monitoring_stack_garage_node_id }}
  changed_when: true
  when: "'dc1' not in _garage_layout.stdout"

- name: "Monitoring Stack: GarageHQ - Apply layout"
  become: true
  become_user: "{{ podman_user }}"
  ansible.builtin.command:
    cmd: podman exec garage /garage layout apply --version 1
  changed_when: true
  when: "'dc1' not in _garage_layout.stdout"

- name: "Monitoring Stack: GarageHQ - List existing buckets"
  become: true
  become_user: "{{ podman_user }}"
  ansible.builtin.command:
    cmd: podman exec garage /garage bucket list
  register: _garage_buckets
  changed_when: false

- name: "Monitoring Stack: GarageHQ - Create Mimir bucket"
  become: true
  become_user: "{{ podman_user }}"
  ansible.builtin.command:
    cmd: podman exec garage /garage bucket create {{ monitoring_stack_garage_mimir_bucket }}
  changed_when: true
  when: monitoring_stack_garage_mimir_bucket not in _garage_buckets.stdout

- name: "Monitoring Stack: GarageHQ - Create Loki bucket"
  become: true
  become_user: "{{ podman_user }}"
  ansible.builtin.command:
    cmd: podman exec garage /garage bucket create {{ monitoring_stack_garage_loki_bucket }}
  changed_when: true
  when: monitoring_stack_garage_loki_bucket not in _garage_buckets.stdout

- name: "Monitoring Stack: GarageHQ - List existing keys"
  become: true
  become_user: "{{ podman_user }}"
  ansible.builtin.command:
    cmd: podman exec garage /garage key list
  register: _garage_keys
  changed_when: false

- name: "Monitoring Stack: GarageHQ - Create Mimir access key"
  become: true
  become_user: "{{ podman_user }}"
  ansible.builtin.command:
    cmd: podman exec garage /garage key create mimir-key
  register: _mimir_key_create
  changed_when: true
  when: "'mimir-key' not in _garage_keys.stdout"

- name: "Monitoring Stack: GarageHQ - Allow Mimir key on Mimir bucket"
  become: true
  become_user: "{{ podman_user }}"
  ansible.builtin.command:
    cmd: >
      podman exec garage /garage bucket allow
      --read --write --owner
      --key mimir-key
      {{ monitoring_stack_garage_mimir_bucket }}
  changed_when: true
  when: "'mimir-key' not in _garage_keys.stdout"

- name: "Monitoring Stack: GarageHQ - Create Loki access key"
  become: true
  become_user: "{{ podman_user }}"
  ansible.builtin.command:
    cmd: podman exec garage /garage key create loki-key
  register: _loki_key_create
  changed_when: true
  when: "'loki-key' not in _garage_keys.stdout"

- name: "Monitoring Stack: GarageHQ - Allow Loki key on Loki bucket"
  become: true
  become_user: "{{ podman_user }}"
  ansible.builtin.command:
    cmd: >
      podman exec garage /garage bucket allow
      --read --write --owner
      --key loki-key
      {{ monitoring_stack_garage_loki_bucket }}
  changed_when: true
  when: "'loki-key' not in _garage_keys.stdout"

- name: "Monitoring Stack: GarageHQ - Parse Mimir key credentials"
  ansible.builtin.set_fact:
    _mimir_key_id: "{{ _mimir_key_create.stdout | regex_findall('Key ID:\\s+(\\S+)') | first }}"
    _mimir_secret: "{{ _mimir_key_create.stdout | regex_findall('Secret key:\\s+(\\S+)') | first }}"
  when: _mimir_key_create is not skipped

- name: "Monitoring Stack: GarageHQ - Parse Loki key credentials"
  ansible.builtin.set_fact:
    _loki_key_id: "{{ _loki_key_create.stdout | regex_findall('Key ID:\\s+(\\S+)') | first }}"
    _loki_secret: "{{ _loki_key_create.stdout | regex_findall('Secret key:\\s+(\\S+)') | first }}"
  when: _loki_key_create is not skipped
