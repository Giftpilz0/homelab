---
- name: "Monitoring Stack: Create Podman config directory"
  become: true
  ansible.builtin.file:
    path: /etc/containers/containers.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: "Monitoring Stack: Validate secrets"
  ansible.builtin.assert:
    that:
      - monitoring_stack_garage_rpc_secret | length > 0
      - monitoring_stack_garage_admin_token | length > 0
      - monitoring_stack_mimir_access_key_id | length > 0
      - monitoring_stack_mimir_secret_access_key | length > 0
      - monitoring_stack_loki_access_key_id | length > 0
      - monitoring_stack_loki_secret_access_key | length > 0
      - monitoring_stack_loki_basic_auth_hash | length > 0
      - monitoring_stack_mimir_basic_auth_hash | length > 0
      - >-
        not (monitoring_stack_perses_oidc_enabled | bool) or
        monitoring_stack_perses_oidc_client_secret | length > 0
    fail_msg: >-
      Define all monitoring stack credentials in SOPS-encrypted inventory
      variables.

- name: "Monitoring Stack: Deploy podman proxy configuration"
  become: true
  ansible.builtin.template:
    src: "monitoring-stack-pod/proxy.conf.j2"
    dest: /etc/containers/containers.conf.d/proxy.conf
    owner: root
    group: root
    mode: "0644"
  when: monitoring_stack_proxy_enabled

- name: "Monitoring Stack: Delete quadlet directory"
  become: true
  become_user: "{{ podman_user }}"
  ansible.builtin.file:
    path: >-
      /home/{{ podman_user }}/.config/containers/systemd/monitoring-stack-pod
    state: absent

- name: "Monitoring Stack: Enable lingering"
  become: true
  ansible.builtin.command: loginctl enable-linger {{ podman_user }}
  changed_when: true

- name: "Monitoring Stack: Create quadlet directory"
  become: true
  become_user: "{{ podman_user }}"
  ansible.builtin.file:
    path: "/home/{{ podman_user }}/.config/containers/systemd"
    state: directory
    owner: "{{ podman_user }}"
    group: "{{ podman_user }}"
    mode: "0755"

- name: "Monitoring Stack: Create directory structure"
  become: true
  become_user: "{{ podman_user }}"
  ansible.builtin.file:
    path: "/home/{{ podman_user }}/.config/containers/systemd/{{ item.path }}"
    state: directory
    owner: "{{ podman_user }}"
    group: "{{ podman_user }}"
    mode: >-
      {{ '0700' if item.path == 'monitoring-stack-pod/config' else item.mode }}
  with_community.general.filetree: "templates/"
  when: item.state == 'directory'

- name: "Monitoring Stack: Template quadlet files"
  become: true
  become_user: "{{ podman_user }}"
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "/home/{{ podman_user }}/.config/containers/systemd/{{ item.path }}"
    owner: "{{ podman_user }}"
    group: "{{ podman_user }}"
    mode: "{{ item.mode }}"
  with_community.general.filetree: "templates/"
  when: item.state == 'file'

- name: "Monitoring Stack: Copy extra files"
  become: true
  become_user: "{{ podman_user }}"
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "/home/{{ podman_user }}/.config/containers/systemd/monitoring-stack-pod/{{ item.dest }}"
    owner: "{{ podman_user }}"
    group: "{{ podman_user }}"
    mode: "{{ item.mode | default('0640') }}"
  loop: "{{ monitoring_stack_extra_files | default([]) }}"
  when:
    - "monitoring_stack_extra_files | default([]) | length > 0"
    - item.src is defined
    - not (item.template | default(false))

- name: "Monitoring Stack: Template extra files"
  become: true
  become_user: "{{ podman_user }}"
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "/home/{{ podman_user }}/.config/containers/systemd/monitoring-stack-pod/{{ item.dest }}"
    owner: "{{ podman_user }}"
    group: "{{ podman_user }}"
    mode: "{{ item.mode | default('0640') }}"
  loop: "{{ monitoring_stack_extra_files | default([]) }}"
  when:
    - "monitoring_stack_extra_files | default([]) | length > 0"
    - item.src is defined
    - item.template | default(false)

- name: "Monitoring Stack: Copy extra directories"
  become: true
  become_user: "{{ podman_user }}"
  ansible.builtin.copy:
    src: "{{ item.src }}/"
    dest: "/home/{{ podman_user }}/.config/containers/systemd/monitoring-stack-pod/{{ item.dest }}"
    owner: "{{ podman_user }}"
    group: "{{ podman_user }}"
    mode: "{{ item.mode | default('0755') }}"
  loop: "{{ monitoring_stack_extra_dirs | default([]) }}"
  when:
    - "monitoring_stack_extra_dirs | default([]) | length > 0"
    - item.src is defined

- name: "Monitoring Stack: systemd daemon reload"
  become: true
  become_user: "{{ podman_user }}"
  ansible.builtin.systemd:
    daemon_reload: true
    scope: user

- name: "Monitoring Stack: Start network service"
  become: true
  become_user: "{{ podman_user }}"
  ansible.builtin.systemd:
    name: monitoring-stack-network.service
    enabled: true
    state: restarted
    scope: user
  when: monitoring_stack_network_enabled

- name: "Monitoring Stack: Start pod service"
  become: true
  become_user: "{{ podman_user }}"
  ansible.builtin.systemd:
    name: monitoring-stack-pod.service
    enabled: true
    state: restarted
    scope: user

- name: "Monitoring Stack: Enable podman-auto-update timer"
  become: true
  become_user: "{{ podman_user }}"
  ansible.builtin.systemd:
    name: podman-auto-update.timer
    enabled: true
    state: started
    scope: user

- name: "Monitoring Stack: Run GarageHQ initialization"
  ansible.builtin.include_tasks: garage_init.yaml
  when: monitoring_stack_garage_init | bool

- name: "Monitoring Stack: Configure traefik"
  ansible.builtin.include_role:
    name: giftpilz0.container.traefik
  when: traefik_http_services is defined or traefik_tcp_services is defined

- name: "Monitoring Stack: summary"
  ansible.builtin.debug:
    msg:
      - "===== Monitoring Stack deployed ====="
      - "=== IMPORTANT: Garage init finished ==="
      - "Copy into your SOPS file:"
      - "  monitoring_stack_mimir_access_key_id: {{ _mimir_key_id }}"
      - "  monitoring_stack_mimir_secret_access_key: {{ _mimir_secret }}"
      - "  monitoring_stack_loki_access_key_id: {{ _loki_key_id }}"
      - "  monitoring_stack_loki_secret_access_key: {{ _loki_secret }}"
      - "Then set monitoring_stack_garage_init: false"
  when: monitoring_stack_garage_init | bool and _mimir_key_id is defined
