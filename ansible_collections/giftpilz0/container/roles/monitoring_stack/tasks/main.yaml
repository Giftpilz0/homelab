---
- name: "Monitoring Stack: Validate secrets"
  ansible.builtin.assert:
    that:
      - monitoring_stack_garage_rpc_secret | length > 0
      - monitoring_stack_garage_admin_token | length > 0
      - monitoring_stack_loki_basic_auth_hash | length > 0
      - monitoring_stack_mimir_basic_auth_hash | length > 0
      - monitoring_stack_garage_init or monitoring_stack_mimir_access_key_id | length > 0
      - monitoring_stack_garage_init or monitoring_stack_mimir_secret_access_key | length > 0
      - monitoring_stack_garage_init or monitoring_stack_loki_access_key_id | length > 0
      - monitoring_stack_garage_init or monitoring_stack_loki_secret_access_key | length > 0
      - not monitoring_stack_perses_oidc_enabled or monitoring_stack_perses_oidc_client_secret | length > 0
    fail_msg: "Define all monitoring stack credentials in SOPS-encrypted inventory variables."
    quiet: true

- name: "Monitoring Stack: Deploy pod"
  ansible.builtin.include_role:
    name: giftpilz0.container.quadlet
  vars:
    quadlet_role: monitoring_stack
    quadlet_dir_modes:
      monitoring-stack-pod/config: "0700"
    quadlet_extra_files: "{{ monitoring_stack_extra_files }}"
    quadlet_extra_dirs: "{{ monitoring_stack_extra_dirs }}"
    quadlet_units: "{{ (['monitoring-stack-network.service'] if monitoring_stack_network_enabled else []) + ['monitoring-stack-pod.service'] }}"

- name: "Monitoring Stack: Initialize GarageHQ"
  ansible.builtin.include_tasks: garage_init.yaml
  when: monitoring_stack_garage_init

- name: "Monitoring Stack: Show generated GarageHQ credentials"
  ansible.builtin.debug:
    msg:
      - "GarageHQ initialization finished. Copy into the SOPS secrets file:"
      - "  monitoring_stack_mimir_access_key_id: {{ _mimir_key_id }}"
      - "  monitoring_stack_mimir_secret_access_key: {{ _mimir_secret }}"
      - "  monitoring_stack_loki_access_key_id: {{ _loki_key_id }}"
      - "  monitoring_stack_loki_secret_access_key: {{ _loki_secret }}"
      - "Then set monitoring_stack_garage_init: false"
  when: monitoring_stack_garage_init and _mimir_key_id is defined
