---
argument_specs:
  main:
    short_description: Deploy MariaDB as a Podman quadlet.
    options:
      podman_user:
        type: str
        required: false
        default: "{{ ansible_user }}"
        description: system user for rootless podman operations.

      mariadb_proxy_enabled:
        type: bool
        required: false
        default: false
        description: enable HTTP proxy for image pulls.

      mariadb_proxy_http:
        type: str
        required: false
        default: ""
        description: HTTP proxy URL.

      mariadb_proxy_https:
        type: str
        required: false
        default: ""
        description: HTTPS proxy URL.

      mariadb_proxy_no_proxy:
        type: str
        required: false
        default: ""
        description: comma-separated list of proxy exclusions.

      mariadb_network_enabled:
        type: bool
        required: false
        default: true
        description: create and manage the podman network.

      mariadb_network_driver:
        type: str
        required: false
        default: bridge
        description: podman network driver.

      mariadb_network_name:
        type: str
        required: false
        default: mariadb-internal
        description: podman network name.

      mariadb_bind_ip:
        type: str
        required: false
        default: "127.0.0.1"
        description: host IP to bind exposed ports to.

      mariadb_port_map_enabled:
        type: bool
        required: false
        default: true
        description: expose container ports on the host.

      mariadb_port_map:
        type: list
        elements: str
        required: false
        default:
          - "3306:3306"
        description: host:container port mappings.

      mariadb_version:
        type: str
        required: false
        default: "12.3"
        description: container image version.

      mariadb_autoupdate:
        type: bool
        required: false
        default: true
        description: enable podman auto-update for this container.

      mariadb_backup_autoupdate:
        type: bool
        required: false
        default: true
        description: enable podman auto-update for the backup container.

      mariadb_db_name:
        type: str
        required: false
        default: mariadb
        description: name of the database to create.

      mariadb_db_user:
        type: str
        required: false
        default: mariadb
        description: database user.

      mariadb_db_password:
        type: str
        required: false
        default: ""
        description: database user password.

      mariadb_environment_vars:
        type: dict
        required: false
        default: {}
        description: extra environment variables injected into the container.

      mariadb_backup_schedule_times:
        type: str
        required: false
        default: "03:00"
        description: backup schedule in HH:MM format.

      mariadb_backup_retention_days:
        type: int
        required: false
        default: 7
        description: number of days to keep backups.

      mariadb_backup_compression:
        type: int
        required: false
        default: 6
        description: zlib compression level (0-9).

      mariadb_cloudbeaver_enabled:
        type: bool
        required: false
        default: false
        description: deploy CloudBeaver management UI.

      mariadb_cloudbeaver_admin_user:
        type: str
        required: false
        default: cbadmin
        description: CloudBeaver admin username.

      mariadb_cloudbeaver_admin_password:
        type: str
        required: false
        default: ""
        description: CloudBeaver admin password.

      mariadb_extra_files:
        type: list
        elements: dict
        required: false
        default: []
        description: list of arbitrary files to copy into the role quadlet directory. Each entry has src (controller path), dest (relative path inside the pod
          quadlet dir) and optional mount (container bind-mount path).

      mariadb_extra_dirs:
        type: list
        elements: dict
        required: false
        default: []
        description: list of arbitrary directories to copy into the role quadlet directory. Each entry has src (controller directory), dest (relative target
          directory inside the pod quadlet dir) and optional mount (container bind-mount path).
