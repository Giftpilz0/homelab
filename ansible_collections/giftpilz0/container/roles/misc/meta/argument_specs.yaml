---
argument_specs:
  main:
    short_description: Deploy the Misc web application (built from a git commit) as a Podman quadlet.
    options:
      podman_user:
        type: str
        required: false
        description: System user for rootless podman operations.

      misc_image:
        type: str
        required: false
        description: Image name without tag.

      misc_version:
        type: str
        required: false
        description: Container image version.

      misc_git_repo:
        type: str
        required: false
        description: Git repository the misc image is built from.

      misc_commit:
        type: str
        required: false
        description: Git commit to build from.

      misc_dockerfile:
        type: str
        required: false
        description: Dockerfile path inside the misc repository.

      misc_autoupdate:
        type: bool
        required: false
        description: Enable podman auto-update for this container.

      misc_network_enabled:
        type: bool
        required: false
        description: Create and manage the podman network.

      misc_network_name:
        type: str
        required: false
        description: Podman network name.

      misc_network_driver:
        type: str
        required: false
        description: Podman network driver.

      misc_port_map_enabled:
        type: bool
        required: false
        description: Expose container ports on the host.

      misc_bind_ip:
        type: str
        required: false
        description: Host IP to bind exposed ports to.

      misc_port_map:
        type: list
        elements: str
        required: false
        description: Host:container port mappings.

      misc_environment_vars:
        type: dict
        required: false
        description: Extra environment variables injected into the container.

      misc_entrypoint:
        type: str
        required: false
        description: Optional container entrypoint override.

      misc_extra_files:
        type: list
        elements: dict
        required: false
        description: Arbitrary file entries with src (controller path) or source (target path), dest, optional mount, mode, and template.

      misc_extra_dirs:
        type: list
        elements: dict
        required: false
        description: Arbitrary directory entries with src (controller directory) or source (target path), dest, optional mount and mode.
