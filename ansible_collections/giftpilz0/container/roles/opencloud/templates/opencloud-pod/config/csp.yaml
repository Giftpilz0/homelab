directives:
  child-src:
    - "'self'"
  connect-src:
    - "'self'"
    - 'blob:'
{% if opencloud_csp_oidc_origin %}
    - '{{ opencloud_csp_oidc_origin }}/'
{% endif %}
  default-src:
    - "'none'"
  font-src:
    - "'self'"
  frame-ancestors:
    - "'self'"
  frame-src:
    - "'self'"
    - 'blob:'
{% if opencloud_collabora_enabled %}
    - '{{ opencloud_collabora_url }}/'
{% endif %}
{% for origin in opencloud_csp_frame_src %}
    - '{{ origin }}/'
{% endfor %}
  img-src:
    - "'self'"
    - 'data:'
    - 'blob:'
  manifest-src:
    - "'self'"
  media-src:
    - "'self'"
    - 'blob:'
  object-src:
    - "'self'"
    - 'blob:'
  script-src:
    - "'self'"
    - "'unsafe-inline'"
{% if opencloud_csp_oidc_origin %}
    - '{{ opencloud_csp_oidc_origin }}/'
{% endif %}
  style-src:
    - "'self'"
    - "'unsafe-inline'"
    - 'blob:'
  worker-src:
    - "'self'"
    - 'blob:'
