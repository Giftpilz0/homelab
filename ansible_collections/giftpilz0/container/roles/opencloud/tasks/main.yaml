---
- name: "OpenCloud: Create Podman config directory"
  become: true
  ansible.builtin.file:
    path: /etc/containers/containers.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: "OpenCloud: Deploy podman proxy configuration"
  become: true
  ansible.builtin.template:
    src: "opencloud-pod/proxy.conf.j2"
    dest: "/etc/containers/containers.conf.d/proxy.conf"
    owner: root
    group: root
    mode: "0644"
  when: opencloud_proxy_enabled

- name: "OpenCloud: Validate optional feature configuration"
  ansible.builtin.assert:
    that:
      - not opencloud_collabora_enabled or opencloud_domain | length > 0
      - not opencloud_collabora_enabled or opencloud_collabora_url | length > 0
      - not opencloud_collabora_enabled or opencloud_collabora_admin_password | length > 0
    fail_msg: >-
      Enabled OpenCloud optional features require their URL, password, source
      directory, and theme path settings to be set.

- name: "OpenCloud: Delete quadlet directory"
  become: true
  become_user: "{{ podman_user }}"
  ansible.builtin.file:
    path: "/home/{{ podman_user }}/.config/containers/systemd/opencloud-pod"
    state: absent

- name: "OpenCloud: Delete quadlet directory"
  become: true
  become_user: "{{ podman_user }}"
  ansible.builtin.file:
    path: "/home/{{ podman_user }}/.config/containers/systemd/opencloud-additional"
    state: absent

- name: "OpenCloud: Remove legacy top-level companion Quadlets"
  become: true
  become_user: "{{ podman_user }}"
  ansible.builtin.file:
    path: "/home/{{ podman_user }}/.config/containers/systemd/{{ item }}"
    state: absent
  loop:
    - collabora.container
    - collabora-proof-key.container
    - collabora-proof-key.volume
    - radicale.container

- name: "OpenCloud: Enable lingering"
  become: true
  ansible.builtin.command: loginctl enable-linger {{ podman_user }}
  changed_when: true

- name: "OpenCloud: Configure unprivileged port range for rootless containers"
  become: true
  ansible.posix.sysctl:
    name: net.ipv4.ip_unprivileged_port_start
    value: "80"
    sysctl_set: true
    sysctl_file: /etc/sysctl.d/99-rootless-ports.conf
    reload: true

- name: "OpenCloud: Create quadlet directory"
  become: true
  become_user: "{{ podman_user }}"
  ansible.builtin.file:
    path: "/home/{{ podman_user }}/.config/containers/systemd"
    state: directory
    owner: "{{ podman_user }}"
    group: "{{ podman_user }}"
    mode: "0755"

- name: "OpenCloud: Create directory structure"
  become: true
  become_user: "{{ podman_user }}"
  ansible.builtin.file:
    path: "/home/{{ podman_user }}/.config/containers/systemd/{{ item.path }}"
    state: directory
    owner: "{{ podman_user }}"
    group: "{{ podman_user }}"
    mode: "{{ item.mode }}"
  with_community.general.filetree: "templates/"
  when: item.state == 'directory'

- name: "OpenCloud: Template quadlet files"
  become: true
  become_user: "{{ podman_user }}"
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "/home/{{ podman_user }}/.config/containers/systemd/{{ item.path }}"
    owner: "{{ podman_user }}"
    group: "{{ podman_user }}"
    mode: "{{ item.mode }}"
  with_community.general.filetree: "templates/"
  when:
    - item.state == 'file'

- name: "Opencloud: Copy extra files"
  become: true
  become_user: "{{ podman_user }}"
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "/home/{{ podman_user }}/.config/containers/systemd/opencloud-pod/{{ item.dest }}"
    owner: "{{ podman_user }}"
    group: "{{ podman_user }}"
    mode: "{{ item.mode | default('0640') }}"
  loop: "{{ opencloud_extra_files | default([]) }}"
  when:
    - "opencloud_extra_files | default([]) | length > 0"
    - item.src is defined
    - not (item.template | default(false))

- name: "Opencloud: Template extra files"
  become: true
  become_user: "{{ podman_user }}"
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "/home/{{ podman_user }}/.config/containers/systemd/opencloud-pod/{{ item.dest }}"
    owner: "{{ podman_user }}"
    group: "{{ podman_user }}"
    mode: "{{ item.mode | default('0640') }}"
  loop: "{{ opencloud_extra_files | default([]) }}"
  when:
    - "opencloud_extra_files | default([]) | length > 0"
    - item.src is defined
    - item.template | default(false)

- name: "Opencloud: Copy extra directories"
  become: true
  become_user: "{{ podman_user }}"
  ansible.builtin.copy:
    src: "{{ item.src }}/"
    dest: "/home/{{ podman_user }}/.config/containers/systemd/opencloud-pod/{{ item.dest }}"
    owner: "{{ podman_user }}"
    group: "{{ podman_user }}"
    mode: "{{ item.mode | default('0755') }}"
  loop: "{{ opencloud_extra_dirs | default([]) }}"
  when:
    - "opencloud_extra_dirs | default([]) | length > 0"
    - item.src is defined

- name: "OpenCloud: systemd daemon reload"
  become: true
  become_user: "{{ podman_user }}"
  ansible.builtin.systemd:
    daemon_reload: true
    scope: user

- name: "OpenCloud: Start network service"
  become: true
  become_user: "{{ podman_user }}"
  ansible.builtin.systemd:
    name: opencloud-network.service
    enabled: true
    state: restarted
    scope: user
  when: opencloud_network_enabled

- name: "OpenCloud: Start pod service"
  become: true
  become_user: "{{ podman_user }}"
  ansible.builtin.systemd:
    name: opencloud-pod.service
    enabled: true
    state: restarted
    scope: user

- name: "OpenCloud: Generate Collabora proof key"
  become: true
  become_user: "{{ podman_user }}"
  ansible.builtin.systemd:
    name: collabora-proof-key.service
    enabled: true
    state: started
    scope: user
  when: opencloud_collabora_enabled

- name: "OpenCloud: Start Collabora pod service"
  become: true
  become_user: "{{ podman_user }}"
  ansible.builtin.systemd:
    name: collabora-pod.service
    enabled: true
    state: restarted
    scope: user
  when: opencloud_collabora_enabled

- name: "OpenCloud: Start Radicale pod service"
  become: true
  become_user: "{{ podman_user }}"
  ansible.builtin.systemd:
    name: radicale-pod.service
    enabled: true
    state: restarted
    scope: user
  when: opencloud_radicale_enabled

- name: "OpenCloud: Enable podman-auto-update timer"
  become: true
  become_user: "{{ podman_user }}"
  ansible.builtin.systemd:
    name: podman-auto-update.timer
    enabled: true
    state: started
    scope: user

- name: "Opencloud: Configure traefik"
  ansible.builtin.include_role:
    name: giftpilz0.container.traefik
  when: traefik_http_services is defined or traefik_tcp_services is defined
