---
- name: "OpenCloud: Validate optional feature configuration"
  ansible.builtin.assert:
    that:
      - not opencloud_collabora_enabled or opencloud_domain | length > 0
      - not opencloud_collabora_enabled or opencloud_collabora_url | length > 0
      - not opencloud_collabora_enabled or opencloud_collabora_admin_password | length > 0
    fail_msg: "Collabora requires opencloud_domain, opencloud_collabora_url and opencloud_collabora_admin_password."
    quiet: true

- name: "OpenCloud: Deploy pods"
  ansible.builtin.include_role:
    name: giftpilz0.container.quadlet
  vars:
    quadlet_role: opencloud
    quadlet_extra_files: "{{ opencloud_extra_files }}"
    quadlet_extra_dirs: "{{ opencloud_extra_dirs }}"
    quadlet_units: >-
      {{ (['opencloud-network.service'] if opencloud_network_enabled else [])
         + ['opencloud-pod.service']
         + (['collabora-proof-key.service', 'collabora-pod.service'] if opencloud_collabora_enabled else [])
         + (['radicale-pod.service'] if opencloud_radicale_enabled else []) }}
