---
## Primary
# The system user under which Podman containers are managed.
podman_user: "{{ ansible_user }}"

# Network
# Network to join even when _network_enabled: false
opencloud_network_enabled: true
opencloud_network_name: "opencloud-internal"

# Optional: expose this service directly on the host, bypassing Traefik.
# Not required for Traefik to reach it -- Traefik connects directly over the
# shared Podman network using the container name and container port.
# _bind_ip and _port_map are independent: override _bind_ip alone to change
# where it's exposed, or _port_map alone ("host_port:container_port") to
# change which ports -- no need to redefine both together.
opencloud_bind_ip: "127.0.0.1"
opencloud_port_map_enabled: true
opencloud_port_map:
  - "9200:9200"

# Versions
# renovate: datasource=docker depName=opencloudeu/opencloud-rolling
opencloud_version: "7.5.0"

# Autoupdate
opencloud_autoupdate: true

# Environment
opencloud_domain: ""
opencloud_admin_password: ""
opencloud_log_level: "info"
opencloud_csp_oidc_origin: ""

# Collabora Online
opencloud_collabora_enabled: false

# Versions
# renovate: datasource=docker depName=collabora/code
opencloud_collabora_version: "26.04.3.1.1"

opencloud_collabora_url: ""
opencloud_collabora_admin_username: "admin"
opencloud_collabora_admin_password: ""

# Radicale CalDAV/CardDAV
opencloud_radicale_enabled: false

# Versions
# renovate: datasource=docker depName=opencloudeu/radicale
opencloud_radicale_version: "v3.7.8"

# Custom web assets and plugins are supplied by each inventory via
# opencloud_extra_dirs (staged into opencloud-pod/assets/...), not bundled
# with the role.

# Copy arbitrary extra files/directories from the inventory into this role's
# quadlet directory (relative to the <role>-pod dir).
# Each entry: { src: <controller path>, dest: <relative target path>,
#               mount: <optional container bind-mount path> }
# Entries with a mount are staged (copied) and bind-mounted into the container.
# Theming/plugins env vars and the web-config.json mount are enabled
# automatically when an entry mounts to the matching OpenCloud asset path.
# Example:
#   opencloud_extra_dirs:
#     - src: "assets/opencloud/themes"
#       dest: "assets/themes"
#       mount: "/var/lib/opencloud/web/assets/custom-themes"
#     - src: "assets/opencloud/plugins"
#       dest: "assets/apps"
#       mount: "/var/lib/opencloud/web/assets/custom-apps"
opencloud_extra_files: []
opencloud_extra_dirs: []

# Merge OIDC clients (only used when external OIDC is disabled)
opencloud_oidc_clients: "{{ opencloud_standard_clients + opencloud_custom_clients }}"

## Advanced
# Proxy
opencloud_proxy_enabled: false
opencloud_proxy_http: ""
opencloud_proxy_https: ""
opencloud_proxy_no_proxy: ""
opencloud_proxy_env: "{{ (['https_proxy=' ~ opencloud_proxy_https] + (['http_proxy=' ~ opencloud_proxy_http] if opencloud_proxy_http else []) + (['no_proxy=' ~ opencloud_proxy_no_proxy]
  if opencloud_proxy_no_proxy else [])) if opencloud_proxy_enabled else [] }}"

# Network driver
opencloud_network_driver: "bridge"

# Environment
opencloud_environment_vars:
  IDM_ADMIN_PASSWORD: "{{ opencloud_admin_password }}"
  OPEN_CLOUD_LOG_LEVEL: "{{ opencloud_log_level }}"
  OC_URL: "{{ opencloud_domain }}"
  OC_CORS_ALLOW_ORIGINS: "{{ opencloud_domain }}"
  PROXY_TLS: false
  FRONTEND_ARCHIVER_MAX_SIZE: 68719476736
  THUMBNAILS_MAX_CONCURRENT_REQUESTS: 64
  FRONTEND_CHECK_FOR_UPDATES: false

# Collabora advanced
opencloud_collabora_ssl_enable: true
opencloud_collabora_ssl_verification: true
opencloud_collabora_ssl_termination: true
opencloud_collabora_home_mode: false
# opencloud_collabora_url is the browser-facing editor URL. The role does not
# publish a host port or configure a reverse proxy; route this URL as desired.
# Route opencloud_collabora_url through Traefik to http://collabora:9980 on
# the shared OpenCloud network, for example:
# traefik_http_services:
#   - name: collabora
#     domain: office.example.com
#     rule: "Host(`office.example.com`)"
#     servers:
#       - url: "http://collabora:9980"
#     tls_enabled: true
#     acme_enabled: true

# OIDC Clients Configuration
opencloud_standard_clients:
  - id: web
    name: "OpenCloud Web App"
    trusted: true
    secret: ""
    redirect_uris:
      - "{{ opencloud_domain }}/"
      - "{{ opencloud_domain }}/oidc-callback.html"
      - "{{ opencloud_domain }}/oidc-silent-redirect.html"
    post_logout_redirect_uris: []
    origins:
      - "{{ opencloud_domain }}"
    application_type: ""

  - id: OpenCloudDesktop
    name: "OpenCloud Desktop Client"
    trusted: false
    secret: ""
    redirect_uris:
      - "http://127.0.0.1"
      - "http://localhost"
    post_logout_redirect_uris: []
    origins: []
    application_type: "native"

  - id: OpenCloudAndroid
    name: "OpenCloud Android App"
    trusted: false
    secret: ""
    redirect_uris:
      - "oc://android.opencloud.eu"
    post_logout_redirect_uris:
      - "oc://android.opencloud.eu"
    origins: []
    application_type: "native"

  - id: OpenCloudIOS
    name: "OpenCloud iOS App"
    trusted: false
    secret: ""
    redirect_uris:
      - "oc://ios.opencloud.eu"
    post_logout_redirect_uris:
      - "oc://ios.opencloud.eu"
    origins: []
    application_type: "native"

# Custom OIDC Clients
opencloud_custom_clients: []
