---
## Primary
podman_user: "{{ ansible_user }}"

# Image
opencloud_image: "docker.io/opencloudeu/opencloud-rolling"
# renovate: datasource=docker depName=opencloudeu/opencloud-rolling
opencloud_version: "8.1.0"
# Applies to all OpenCloud pods
opencloud_autoupdate: true

# Network (always joined, created only when enabled)
opencloud_network_enabled: true
opencloud_network_name: "opencloud-internal"
opencloud_network_driver: "bridge"

# Host ports (not needed behind Traefik)
opencloud_port_map_enabled: true
opencloud_bind_ip: "127.0.0.1"
opencloud_port_map:
  - "9200:9200"

## Service
opencloud_domain: ""
opencloud_admin_password: ""
opencloud_log_level: "info"
opencloud_csp_oidc_origin: ""

# Environment
opencloud_environment_vars:
  IDM_ADMIN_PASSWORD: "{{ opencloud_admin_password }}"
  OPEN_CLOUD_LOG_LEVEL: "{{ opencloud_log_level }}"
  OC_URL: "{{ opencloud_domain }}"
  OC_CORS_ALLOW_ORIGINS: "{{ opencloud_domain }}"
  PROXY_TLS: false
  FRONTEND_ARCHIVER_MAX_SIZE: 68719476736
  THUMBNAILS_MAX_CONCURRENT_REQUESTS: 64
  FRONTEND_CHECK_FOR_UPDATES: false

# Clients of the built-in IDP (unused with external OIDC)
opencloud_oidc_clients: "{{ opencloud_standard_clients + opencloud_custom_clients }}"
opencloud_standard_clients:
  - id: web
    name: "OpenCloud Web App"
    trusted: true
    secret: ""
    redirect_uris:
      - "{{ opencloud_domain }}/"
      - "{{ opencloud_domain }}/oidc-callback.html"
      - "{{ opencloud_domain }}/oidc-silent-redirect.html"
    post_logout_redirect_uris: []
    origins:
      - "{{ opencloud_domain }}"
    application_type: ""

  - id: OpenCloudDesktop
    name: "OpenCloud Desktop Client"
    trusted: false
    secret: ""
    redirect_uris:
      - "http://127.0.0.1"
      - "http://localhost"
    post_logout_redirect_uris: []
    origins: []
    application_type: "native"

  - id: OpenCloudAndroid
    name: "OpenCloud Android App"
    trusted: false
    secret: ""
    redirect_uris:
      - "oc://android.opencloud.eu"
    post_logout_redirect_uris:
      - "oc://android.opencloud.eu"
    origins: []
    application_type: "native"

  - id: OpenCloudIOS
    name: "OpenCloud iOS App"
    trusted: false
    secret: ""
    redirect_uris:
      - "oc://ios.opencloud.eu"
    post_logout_redirect_uris:
      - "oc://ios.opencloud.eu"
    origins: []
    application_type: "native"

# Example:
#   opencloud_custom_clients:
#     - id: forgejo
#       name: "forgejo"
#       trusted: false
#       secret: "{{ forgejo_oauth_client_secret }}"
#       redirect_uris:
#         - "https://{{ forgejo_domain }}/user/oauth2/opencloud/callback"
#       post_logout_redirect_uris: []
#       origins:
#         - "https://{{ forgejo_domain }}"
#       application_type: "web"
opencloud_custom_clients: []

## Collabora Online (collabora-pod)
opencloud_collabora_enabled: false
opencloud_collabora_image: "docker.io/collabora/code"
# renovate: datasource=docker depName=collabora/code
opencloud_collabora_version: "26.04.5.1.1"
opencloud_collabora_proof_key_image: "docker.io/alpine/openssl"
# renovate: datasource=docker depName=alpine/openssl
opencloud_collabora_proof_key_version: "3.5.9"
# Public editor URL, routed by Traefik to collabora-pod:9980
opencloud_collabora_url: ""
opencloud_collabora_admin_username: "admin"
opencloud_collabora_admin_password: ""
opencloud_collabora_ssl_enable: true
opencloud_collabora_ssl_verification: true
opencloud_collabora_ssl_termination: true
# Disables welcome and feedback popups, limits to 20 connections / 10 documents
opencloud_collabora_home_mode: false
# "New version available" notice in the editor
opencloud_collabora_update_popup: false

## Radicale CalDAV/CardDAV (radicale-pod)
opencloud_radicale_enabled: false
opencloud_radicale_image: "docker.io/opencloudeu/radicale"
# renovate: datasource=docker depName=opencloudeu/radicale
opencloud_radicale_version: "v3.8.3"

## Advanced
opencloud_entrypoint: ""
opencloud_collabora_entrypoint: ""
opencloud_collabora_proof_key_entrypoint: ""
opencloud_radicale_entrypoint: ""

# Extra inventory files/dirs, format: see quadlet defaults
# Mounts to /var/lib/opencloud/web/assets/custom-{themes,apps} enable theming/plugins
opencloud_extra_files: []
opencloud_extra_dirs: []
