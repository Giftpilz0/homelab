---
- name: "Suwayomi: Deploy pod"
  ansible.builtin.include_role:
    name: giftpilz0.container.quadlet
  vars:
    quadlet_role: suwayomi
    quadlet_extra_files: "{{ suwayomi_extra_files }}"
    quadlet_extra_dirs: "{{ suwayomi_extra_dirs }}"
    quadlet_units: "{{ (['suwayomi-network.service'] if suwayomi_network_enabled else []) + ['suwayomi-pod.service'] }}"
