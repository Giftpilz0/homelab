---
- name: "Dashboard: Deploy pod"
  ansible.builtin.include_role:
    name: giftpilz0.container.quadlet
  vars:
    quadlet_role: dashboard
    quadlet_extra_files: "{{ dashboard_extra_files }}"
    quadlet_extra_dirs: "{{ dashboard_extra_dirs }}"
    quadlet_units: "{{ (['dashboard-network.service'] if dashboard_network_enabled else []) + ['dashboard-pod.service'] }}"
