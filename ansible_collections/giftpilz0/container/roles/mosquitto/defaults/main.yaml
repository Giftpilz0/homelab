---
## Primary
podman_user: "{{ ansible_user }}"

# Image (built locally from build/: mosquitto from source + mosquitto-go-auth against its headers)
mosquitto_image: "localhost/mosquitto-custom"
# renovate: datasource=github-tags depName=eclipse-mosquitto/mosquitto extractVersion=^v(?<version>.+)$
mosquitto_version: "2.1.2"
# renovate: datasource=github-tags depName=lhns/mosquitto-go-auth
mosquitto_go_auth_version: "3.5.1"
mosquitto_autoupdate: true

# Network (always joined, created only when enabled)
mosquitto_network_enabled: true
mosquitto_network_name: "mosquitto-internal"
mosquitto_network_driver: "bridge"

# Host ports (not needed behind Traefik)
mosquitto_port_map_enabled: true
mosquitto_bind_ip: "127.0.0.1"
mosquitto_port_map:
  - "1883:1883"
  - "9001:9001"

## Service
# {user: password}; hashes are kept, set rehash once after a password change
mosquitto_users: {}
mosquitto_rehash_passwords: false
# {user: hash} for externally managed credentials
mosquitto_pwfile_users: {}

# ACL entries are a topic string or {access, topic}
mosquitto_acl_users: {}
mosquitto_acl_patterns:
  - access: readwrite
    topic: "%u/#"
mosquitto_acl_rules: []

# Rendered as auth_opt_<key>
mosquitto_go_auth_options:
  backends: "files"
  files_password_path: "/mosquitto/config/passwd"
  files_acl_path: "/mosquitto/config/acl"

# Environment
mosquitto_environment_vars: {}

## Advanced
mosquitto_entrypoint: ""

# Extra inventory files/dirs, format: see quadlet defaults
mosquitto_extra_files: []
mosquitto_extra_dirs: []
