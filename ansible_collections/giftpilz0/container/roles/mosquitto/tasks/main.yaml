---
- name: "Mosquitto: Create Podman config directory"
  become: true
  ansible.builtin.file:
    path: /etc/containers/containers.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: "Mosquitto: Deploy podman proxy configuration"
  become: true
  ansible.builtin.template:
    src: "mosquitto-pod/proxy.conf.j2"
    dest: "/etc/containers/containers.conf.d/proxy.conf"
    owner: root
    group: root
    mode: "0644"
  when: mosquitto_proxy_enabled

- name: "Mosquitto: Delete quadlet directory"
  become: true
  become_user: "{{ podman_user }}"
  ansible.builtin.file:
    path: "/home/{{ podman_user }}/.config/containers/systemd/mosquitto-pod"
    state: absent

- name: "Mosquitto: Enable lingering"
  become: true
  ansible.builtin.command: loginctl enable-linger {{ podman_user }}
  changed_when: true

- name: "Mosquitto: Configure unprivileged port range for rootless containers"
  become: true
  ansible.posix.sysctl:
    name: net.ipv4.ip_unprivileged_port_start
    value: "80"
    sysctl_set: true
    sysctl_file: /etc/sysctl.d/99-rootless-ports.conf
    reload: true

- name: "Mosquitto: Create quadlet directory"
  become: true
  become_user: "{{ podman_user }}"
  ansible.builtin.file:
    path: "/home/{{ podman_user }}/.config/containers/systemd"
    state: directory
    owner: "{{ podman_user }}"
    group: "{{ podman_user }}"
    mode: "0755"

- name: "Mosquitto: Create build directory"
  become: true
  ansible.builtin.file:
    path: "/tmp/mosquitto-build"
    state: directory
    mode: "0755"

- name: "Mosquitto: Copy image build files"
  become: true
  ansible.builtin.copy:
    src: "containerbuild/"
    dest: "/tmp/mosquitto-build/"
    mode: preserve

- name: "Mosquitto: Build custom podman image"
  become: true
  become_user: "{{ podman_user }}"
  containers.podman.podman_image:
    name: "{{ mosquitto_image_name }}"
    tag: "{{ mosquitto_image_tag }}"
    path: "/tmp/mosquitto-build"
    build:
      file: "/tmp/mosquitto-build/Dockerfile"
      format: oci
      cache: false
      force_rm: true
      extra_args: "--build-arg GO_AUTH_VERSION={{ mosquitto_go_auth_version }}"
    force: true
  environment:
    https_proxy: "{{ mosquitto_proxy_https if mosquitto_proxy_enabled else '' }}"
    http_proxy: "{{ mosquitto_proxy_http if mosquitto_proxy_enabled else '' }}"
    no_proxy: "{{ mosquitto_proxy_no_proxy if mosquitto_proxy_enabled else '' }}"
  register: mosquitto_image_build

- name: "Mosquitto: Clean up build directory"
  become: true
  ansible.builtin.file:
    path: "/tmp/mosquitto-build"
    state: absent

- name: "Mosquitto: Create directory structure"
  become: true
  become_user: "{{ podman_user }}"
  ansible.builtin.file:
    path: "/home/{{ podman_user }}/.config/containers/systemd/{{ item.path }}"
    state: directory
    owner: "{{ podman_user }}"
    group: "{{ podman_user }}"
    mode: "{{ item.mode }}"
  with_community.general.filetree: "templates/"
  when: item.state == 'directory'

- name: "Mosquitto: Validate go-auth configuration"
  ansible.builtin.assert:
    that:
      - mosquitto_go_auth_options.backends is defined
    fail_msg: "mosquitto_go_auth_options.backends must define at least one go-auth backend."

- name: "Mosquitto: Initialize generated password users"
  ansible.builtin.set_fact:
    mosquitto_generated_pwfile_users: {}

- name: "Mosquitto: Generate password hashes"
  become: true
  become_user: "{{ podman_user }}"
  ansible.builtin.command:
    argv:
      - podman
      - run
      - --rm
      - --entrypoint
      - /usr/bin/mosquitto-go-auth-pw
      - "{{ mosquitto_image }}"
      - -p
      - "{{ item.value }}"
  loop: "{{ mosquitto_users | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  register: mosquitto_generated_passwords
  changed_when: false
  no_log: true
  when: mosquitto_users | length > 0

- name: "Mosquitto: Store generated password hashes"
  ansible.builtin.set_fact:
    mosquitto_generated_pwfile_users: >-
      {{ mosquitto_generated_pwfile_users | combine({item.item.key: item.stdout | trim}) }}
  loop: "{{ mosquitto_generated_passwords.results | default([]) }}"
  loop_control:
    label: "{{ item.item.key }}"
  no_log: true

- name: "Mosquitto: Template quadlet files"
  become: true
  become_user: "{{ podman_user }}"
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "/home/{{ podman_user }}/.config/containers/systemd/{{ item.path }}"
    owner: "{{ podman_user }}"
    group: "{{ podman_user }}"
    mode: "{{ item.mode }}"
  with_community.general.filetree: "templates/"
  when: item.state == 'file'

- name: "Mosquitto: Copy extra files"
  become: true
  become_user: "{{ podman_user }}"
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "/home/{{ podman_user }}/.config/containers/systemd/mosquitto-pod/{{ item.dest }}"
    owner: "{{ podman_user }}"
    group: "{{ podman_user }}"
    mode: preserve
  loop: "{{ mosquitto_extra_files | default([]) }}"
  when: "mosquitto_extra_files | default([]) | length > 0"

- name: "Mosquitto: Copy extra directories"
  become: true
  become_user: "{{ podman_user }}"
  ansible.builtin.copy:
    src: "{{ item.src }}/"
    dest: "/home/{{ podman_user }}/.config/containers/systemd/mosquitto-pod/{{ item.dest }}"
    owner: "{{ podman_user }}"
    group: "{{ podman_user }}"
    mode: preserve
  loop: "{{ mosquitto_extra_dirs | default([]) }}"
  when: "mosquitto_extra_dirs | default([]) | length > 0"

- name: "Mosquitto: systemd daemon reload"
  become: true
  become_user: "{{ podman_user }}"
  ansible.builtin.systemd:
    daemon_reload: true
    scope: user

- name: "Mosquitto: Start network service"
  become: true
  become_user: "{{ podman_user }}"
  ansible.builtin.systemd:
    name: mosquitto-network.service
    enabled: true
    state: restarted
    scope: user
  when: mosquitto_network_enabled

- name: "Mosquitto: Start pod service"
  become: true
  become_user: "{{ podman_user }}"
  ansible.builtin.systemd:
    name: mosquitto-pod.service
    enabled: true
    state: restarted
    scope: user

- name: "Mosquitto: Enable podman-auto-update timer"
  become: true
  become_user: "{{ podman_user }}"
  ansible.builtin.systemd:
    name: podman-auto-update.timer
    enabled: true
    state: started
    scope: user

- name: "Mosquitto: Configure traefik"
  ansible.builtin.include_role:
    name: giftpilz0.container.traefik
  when: traefik_http_services is defined or traefik_tcp_services is defined
