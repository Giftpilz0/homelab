---
argument_specs:
  main:
    short_description: Deploy the Eclipse Mosquitto MQTT broker as a Podman quadlet.
    options:
      podman_user:
        type: str
        required: false
        default: "{{ ansible_user }}"
        description: system user for rootless podman operations.

      mosquitto_proxy_enabled:
        type: bool
        required: false
        default: false
        description: enable HTTP proxy for image pulls.

      mosquitto_proxy_http:
        type: str
        required: false
        default: ""
        description: HTTP proxy URL.

      mosquitto_proxy_https:
        type: str
        required: false
        default: ""
        description: HTTPS proxy URL.

      mosquitto_proxy_no_proxy:
        type: str
        required: false
        default: ""
        description: comma-separated list of proxy exclusions.

      mosquitto_network_enabled:
        type: bool
        required: false
        default: true
        description: create and manage the podman network.

      mosquitto_network_driver:
        type: str
        required: false
        default: bridge
        description: podman network driver.

      mosquitto_network_name:
        type: str
        required: false
        default: mosquitto-internal
        description: podman network name.

      mosquitto_bind_ip:
        type: str
        required: false
        default: "127.0.0.1"
        description: host IP to bind exposed ports to.

      mosquitto_port_map_enabled:
        type: bool
        required: false
        default: true
        description: expose container ports on the host.

      mosquitto_port_map:
        type: list
        elements: str
        required: false
        default:
          - "1883:1883"
          - "9001:9001"
        description: host:container port mappings.

      mosquitto_version:
        type: str
        required: false
        default: "2.1-alpine"
        description: Mosquitto version identifier used in the custom image tag.

      mosquitto_go_auth_version:
        type: str
        required: false
        default: "3.5.0"
        description: mosquitto-go-auth release used to build the image.

      mosquitto_image:
        type: str
        required: false
        description: custom image name and tag.

      mosquitto_image_name:
        type: str
        required: false
        default: "localhost/mosquitto-custom"
        description: custom image name.

      mosquitto_image_tag:
        type: str
        required: false
        description: custom image tag.

      mosquitto_autoupdate:
        type: bool
        required: false
        default: true
        description: enable podman auto-update for this container.

      mosquitto_environment_vars:
        type: dict
        required: false
        default: {}
        description: extra environment variables injected into the container.

      mosquitto_pwfile_users:
        type: dict
        required: false
        default: {}
        description: map of username to password_hash for the password file.

      mosquitto_users:
        type: dict
        required: false
        default: {}
        description: map of username to clear-text password; hashes are generated during deployment.

      mosquitto_acl_users:
        type: dict
        required: false
        default: {}
        description: map of usernames to ACL rule objects or raw topic rules.

      mosquitto_acl_patterns:
        type: list
        elements: dict
        required: false
        default:
          - access: readwrite
            topic: "%u/#"
        description: ACL pattern rules using %u and %c substitutions.

      mosquitto_acl_rules:
        type: list
        elements: str
        required: false
        default: []
        description: raw Mosquitto ACL lines for advanced rules.

      mosquitto_go_auth_options:
        type: dict
        required: false
        description: map passed through as auth_opt_* go-auth settings.

      mosquitto_extra_files:
        type: list
        elements: dict
        required: false
        default: []
        description: list of arbitrary files to copy into the role quadlet directory. Each entry has src (controller path), dest (relative path inside the pod
          quadlet dir) and optional mount (container bind-mount path).

      mosquitto_extra_dirs:
        type: list
        elements: dict
        required: false
        default: []
        description: list of arbitrary directories to copy into the role quadlet directory. Each entry has src (controller directory), dest (relative target
          directory inside the pod quadlet dir) and optional mount (container bind-mount path).
