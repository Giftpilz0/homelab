---
## Primary
# The system user under which Podman containers are managed.
podman_user: "{{ ansible_user }}"

# Network
# Network to join even when _network_enabled: false
navidrome_network_enabled: true
navidrome_network_name: "navidrome-internal"

# Optional: expose this service directly on the host, bypassing Traefik.
# Not required for Traefik to reach it -- Traefik connects directly over the
# shared Podman network using the container name and container port.
# _bind_ip and _port_map are independent: override _bind_ip alone to change
# where it's exposed, or _port_map alone ("host_port:container_port") to
# change which ports -- no need to redefine both together.
navidrome_bind_ip: "127.0.0.1"
navidrome_port_map_enabled: false
navidrome_port_map:
  - "4533:4533"

# Versions
# renovate: datasource=docker depName=deluan/navidrome
navidrome_version: "0.64.2"

# Autoupdate
navidrome_autoupdate: true

# Environment
navidrome_environment_vars:
  ND_MUSICFOLDER: "/music/transcoded"
  ND_DATAFOLDER: "/data"
  ND_CACHEFOLDER: "/cache"
  ND_SCANSCHEDULE: "1h"
  ND_SCANNER_PURGEMISSING: "always"
  ND_LOGLEVEL: "info"
  ND_TRANSCODINGCACHESIZE: "1GB"

# Music library management WebUI.
navidrome_webui_enabled: false
navidrome_webui_image_name: "localhost/music-library-webui"
navidrome_webui_image_tag: "0.1.0"
navidrome_webui_image: "{{ navidrome_webui_image_name }}:{{ navidrome_webui_image_tag }}"
navidrome_webui_commit: "657b0256dd2b8f7e048c92b824f92d11e57dce3f"
navidrome_webui_build_file: "Containerfile"
navidrome_webui_user: "1001:1001"
navidrome_webui_environment_vars:
  MUSIC_LIBRARY_ROOT: "/music"

# Copy arbitrary extra files/directories from the inventory into this role's
# quadlet directory (relative to the <role>-pod dir).
# Each entry supports src (controller path) or source (target path), dest,
# optional mount, mode, and template (files only).
# Example:
#   navidrome_extra_files:
#     - src: "assets/example/config.yaml"
#       dest: "config/example.yaml"
#       mode: "0640"
#       template: true
#       mount: "/etc/example/config.yaml"
#     - source: "/srv/example/license.key"
#       dest: "host-license.key"
#       mount: "/run/secrets/license.key"
#   navidrome_extra_dirs:
#     - src: "assets/example/plugins/"
#       dest: "plugins"
#       mount: "/usr/local/share/example/plugins"
#     - source: "/srv/example/plugins"
#       dest: "host-plugins"
#       mount: "/usr/local/share/example/host-plugins"
navidrome_extra_files: []
navidrome_extra_dirs: []

navidrome_entrypoint: ""

## Advanced
# Proxy
navidrome_proxy_enabled: false
navidrome_proxy_http: ""
navidrome_proxy_https: ""
navidrome_proxy_no_proxy: ""
navidrome_proxy_env: "{{ (['https_proxy=' ~ navidrome_proxy_https] + (['http_proxy=' ~ navidrome_proxy_http] if navidrome_proxy_http else []) + (['no_proxy=' ~ navidrome_proxy_no_proxy] if navidrome_proxy_no_proxy else [])) if navidrome_proxy_enabled else [] }}"

# Network driver
navidrome_network_driver: "bridge"
