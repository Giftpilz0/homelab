---
# renovate: datasource=github-releases depName=creativeprojects/resticprofile extractVersion=^v(?<version>.*)$
resticprofile_version: "0.33.1"
# renovate: datasource=github-releases depName=restic/rest-server extractVersion=^v(?<version>.*)$
rest_server_version: "0.14.0"

# client, server or both
restic_mode: client

restic_user: backup
restic_user_home: "/home/{{ restic_user }}"

# Paths
restic_config_dir: "/etc/resticprofile"
restic_cache_dir: "/var/cache/restic"
restic_log_dir: "{{ restic_config_dir }}/logs"
restic_password_dir: "{{ restic_config_dir }}/passwords"

# SSH key of the client
restic_ssh_key_type: ed25519
restic_ssh_key_path: "{{ restic_user_home }}/.ssh/id_{{ restic_ssh_key_type }}"

# Server
restic_server_repo_base: "/var/lib/restic"
restic_server_host: ""

# Example:
#   restic_repositories:
#     - name: podman-volumes
#       password: "{{ vault_restic_password }}"
#       backup_paths:
#         - /home/container/.local/share/containers/storage/volumes
#       schedule: "*-*-* 02:00:00"
restic_repositories: []

restic_repository_defaults:
  exclude_patterns: []
  retention:
    keep_daily: 14
    keep_weekly: 8
    keep_monthly: 12
    keep_yearly: 3
