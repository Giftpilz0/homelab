---
- name: "Restic: Install restic"
  become: true
  ansible.builtin.package:
    name: restic
    state: present

- name: "Restic: Create resticprofile release directory"
  become: true
  ansible.builtin.file:
    path: /usr/local/lib/resticprofile-{{ resticprofile_version }}
    state: directory
    mode: "0755"

- name: "Restic: Download resticprofile"
  become: true
  ansible.builtin.unarchive:
    src: "https://github.com/creativeprojects/resticprofile/releases/download/v{{ resticprofile_version }}/resticprofile_{{ resticprofile_version }}_linux_{{ _restic_arch }}.tar.gz"
    dest: /usr/local/lib/resticprofile-{{ resticprofile_version }}
    remote_src: true
    include:
      - resticprofile
    creates: /usr/local/lib/resticprofile-{{ resticprofile_version }}/resticprofile

- name: "Restic: Install resticprofile"
  become: true
  ansible.builtin.copy:
    src: /usr/local/lib/resticprofile-{{ resticprofile_version }}/resticprofile
    dest: /usr/local/bin/resticprofile
    remote_src: true
    owner: root
    group: root
    mode: "0755"
