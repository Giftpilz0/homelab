---
- name: "Restic: Validate configuration"
  ansible.builtin.assert:
    that: restic_server_host | length > 0
    fail_msg: "Set restic_server_host."
    quiet: true

- name: "Restic: Scan server SSH host keys"
  ansible.builtin.command:
    cmd: "ssh-keyscan -p 22 {{ restic_server_host }}"
  register: _restic_host_keys
  changed_when: false

- name: "Restic: Add server to known_hosts"
  become: true
  ansible.builtin.lineinfile:
    path: "{{ restic_user_home }}/.ssh/known_hosts"
    line: "{{ item }}"
    create: true
    owner: "{{ restic_user }}"
    group: "{{ restic_user }}"
    mode: "0644"
  loop: "{{ _restic_host_keys.stdout_lines | reject('match', '^#') | select('search', '\\S') }}"

- name: "Restic: Create configuration directory"
  become: true
  ansible.builtin.file:
    path: "{{ restic_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: "Restic: Create logs directory"
  become: true
  ansible.builtin.file:
    path: "{{ restic_log_dir }}"
    state: directory
    owner: "{{ restic_user }}"
    group: "{{ restic_user }}"
    mode: "0755"

- name: "Restic: Create password directory"
  become: true
  ansible.builtin.file:
    path: "{{ restic_password_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: "Restic: Create repository password files"
  become: true
  ansible.builtin.copy:
    content: "{{ item.password }}"
    dest: "{{ restic_password_dir }}/{{ item.name }}.txt"
    owner: root
    group: root
    mode: "0600"
  loop: "{{ _restic_repositories }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true

- name: "Restic: Create cache directories"
  become: true
  ansible.builtin.file:
    path: "{{ restic_cache_dir }}/{{ item.name }}"
    state: directory
    owner: "{{ restic_user }}"
    group: "{{ restic_user }}"
    mode: "0755"
  loop: "{{ _restic_repositories }}"
  loop_control:
    label: "{{ item.name }}"

- name: "Restic: Create resticprofile configuration"
  become: true
  ansible.builtin.template:
    src: profiles.yaml.j2
    dest: "{{ restic_config_dir }}/profiles.yaml"
    owner: root
    group: root
    mode: "0644"
  when: restic_repositories | length > 0

- name: "Restic: Schedule backup jobs"
  become: true
  ansible.builtin.command:
    argv:
      - /usr/local/bin/resticprofile
      - --config
      - "{{ restic_config_dir }}/profiles.yaml"
      - --name
      - "{{ item.name }}"
      - schedule
    chdir: "{{ restic_config_dir }}"
  loop: "{{ _restic_repositories }}"
  loop_control:
    label: "{{ item.name }}"
  register: _restic_schedule
  changed_when: "'schedule created' in _restic_schedule.stdout or 'schedule updated' in _restic_schedule.stdout"
