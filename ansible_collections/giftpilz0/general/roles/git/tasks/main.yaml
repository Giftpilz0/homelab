---
######################################
### packages

- name: "Git: Manage packages"
  become: true
  ansible.builtin.package:
    name: "{{ git_package }}"
    state: "{{ git_package_state }}"

######################################
### config

- name: "Git: Manage system git config"
  become: true
  community.general.git_config:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    scope: system
  loop: "{{ git_config_system }}"

- name: "Git: Manage git config"
  community.general.git_config:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    scope: "{{ item.scope }}"
  loop: "{{ git_config }}"
