---
- name: "Firewalld: Restart"
  become: true
  ansible.builtin.service:
    name: "{{ firewalld_service_name }}"
    state: restarted
  when: firewalld_package_state != 'absent'

- name: "Firewalld: Reload"
  become: true
  ansible.builtin.command: firewall-cmd --reload
  changed_when: true
  when: firewalld_package_state != 'absent'
