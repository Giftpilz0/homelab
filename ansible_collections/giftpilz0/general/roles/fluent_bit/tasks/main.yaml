---
- name: "Fluent Bit: Validate parameters"
  ansible.builtin.assert:
    that:
      - fluent_bit_http_host | length > 0
    fail_msg: "Define fluent_bit_http_host."
    quiet: true

# The name is used in tags and file names
- name: "Fluent Bit: Validate log file inputs"
  ansible.builtin.assert:
    that:
      - item.name is defined
      - item.name is match('^[A-Za-z0-9_-]+$')
      - fluent_bit_tail_inputs | selectattr('name', 'defined') | selectattr('name', 'equalto', item.name) | length == 1
      - item.path is defined
    fail_msg: "Log file inputs need a path and a unique name of letters, digits, - and _: {{ item }}"
    quiet: true
  loop: "{{ fluent_bit_tail_inputs }}"
  loop_control:
    label: "{{ item.name | default('unnamed') }}"

- name: "Fluent Bit: Configure Linux"
  ansible.builtin.include_tasks: linux.yaml
  when: ansible_facts['system'] == 'Linux'

- name: "Fluent Bit: Configure Windows"
  ansible.builtin.include_tasks: windows.yaml
  when: ansible_facts['os_family'] == 'Windows'

- name: "Fluent Bit: Reject unsupported operating system"
  ansible.builtin.fail:
    msg: "The Fluent Bit role supports Linux and Windows only (detected {{ ansible_facts['system'] }})."
  when:
    - ansible_facts['system'] != 'Linux'
    - ansible_facts['os_family'] != 'Windows'
