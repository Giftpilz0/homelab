---
autoupgrade_auto_apply: true
autoupgrade_upgrade_type: default

# Red Hat accepts never, when-changed, or when-needed.
# Debian accepts the string values false or true.
autoupgrade_reboot: >-
  {{ 'false' if ansible_facts['os_family'] == 'Debian' else 'never' }}

autoupgrade_blacklist: []
autoupgrade_mail_report: ""
autoupgrade_mail: ""
