---
argument_specs:
  main:
    short_description: Configure automatic package upgrades with dnf-automatic.
    options:
      autoupgrade_service_name:
        type: str
        required: false
        description: systemd service or timer unit name.

      autoupgrade_service_state:
        type: str
        required: false
        choices:
          - reloaded
          - restarted
          - started
          - stopped
        description: desired state of the autoupgrade service.

      autoupgrade_service_enabled:
        type: bool
        required: false
        description: whether the autoupgrade service is enabled at boot.

      autoupgrade_package_state:
        type: str
        required: false
        choices:
          - present
          - absent
          - latest
        description: desired state of autoupgrade packages.

      autoupgrade_package_list:
        type: list
        elements: str
        required: false
        description: list of packages to install for automatic upgrades.

      autoupgrade_config_path:
        type: str
        required: false
        description: path to the autoupgrade configuration file.

      autoupgrade_auto_apply:
        type: bool
        required: false
        description: whether to automatically apply package upgrades.

      autoupgrade_upgrade_type:
        type: str
        required: false
        choices:
          - default
          - security
        description: type of upgrades to apply.

      autoupgrade_reboot:
        type: bool
        required: false
        description: reboot behavior after upgrades.

      autoupgrade_blacklist:
        type: list
        elements: str
        required: false
        description: list of packages excluded from automatic upgrades.

      autoupgrade_mail_report:
        type: str
        required: false
        description: email reporting frequency (e.g. on-change, always, only-on-error).

      autoupgrade_mail:
        type: str
        required: false
        description: recipient email address for upgrade reports.
