---
packages_package_state: present
packages_package:
  - curl
  - "{{ 'mkpasswd' if ansible_facts['os_family'] == 'RedHat' else 'whois' }}"
  - "{{ 'python-pip' if ansible_facts['os_family'] == 'Archlinux' else 'python3-pip' }}"
  - rsync
  - zstd

packages_additional_package_state: present
packages_additional_package: []

packages_python_package_state: present
packages_python_package: []

# Fedora only: RPM Fusion repositories and codecs
packages_rpmfusion_package_state: skip
packages_rpmfusion_package:
  - https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-{{ ansible_facts['distribution_major_version'] }}.noarch.rpm
  - https://mirrors.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-{{ ansible_facts['distribution_major_version'] }}.noarch.rpm

# [{name, state}], state skip ignores an entry
packages_copr_repos: []

# Only applied when flatpak is installed
packages_flatpak_repos:
  - name: flathub
    flatpakrepo_url: https://dl.flathub.org/repo/flathub.flatpakrepo
    state: present
packages_flatpak_repos_remove: []
# [{name, remote, state}]
packages_flatpak_package: []
