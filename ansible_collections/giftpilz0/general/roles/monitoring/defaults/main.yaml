---
monitoring_agent_arch: amd64
# renovate: datasource=github-releases depName=grafana/alloy extractVersion=^v(?<version>.*)$
monitoring_agent_tag: 1.21.3
# absent also removes config and data
monitoring_agent_package_state: present
monitoring_agent_package_name: alloy
monitoring_agent_package:
  - >-
    https://github.com/grafana/alloy/releases/download/v{{
    monitoring_agent_tag }}/alloy-{{ monitoring_agent_tag }}-1.{{
    monitoring_agent_arch }}.rpm
monitoring_agent_config_path: /etc/alloy/config.alloy
monitoring_agent_data_path: /var/lib/alloy
monitoring_agent_service_name: alloy.service
monitoring_agent_service_state: started
monitoring_agent_service_enabled: true

# Remote write endpoints and credentials
monitoring_agent_config_remoteserver_loki: ""
monitoring_agent_config_remoteserver_prometheus: ""
monitoring_alloy_loki_basic_auth_username: alloy
monitoring_alloy_loki_basic_auth_password: ""
monitoring_alloy_mimir_basic_auth_username: alloy
monitoring_alloy_mimir_basic_auth_password: ""
monitoring_agent_external_labels:
  host: "{{ inventory_hostname }}"

# Journal read access
monitoring_alloy_permissions_setup: true
monitoring_alloy_extra_groups:
  - adm
  - systemd-journal
monitoring_alloy_node_exporter_scrape_interval: 60s
monitoring_alloy_loki_journal_max_age: 24h

# Appended raw Alloy config
monitoring_alloy_extra_config: ""
