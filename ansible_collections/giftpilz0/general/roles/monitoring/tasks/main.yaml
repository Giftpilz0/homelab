---
- name: "Monitoring: Validate remote write configuration"
  ansible.builtin.assert:
    that:
      - monitoring_agent_config_remoteserver_loki | length > 0
      - monitoring_agent_config_remoteserver_prometheus | length > 0
      - monitoring_alloy_loki_basic_auth_password | length > 0
      - monitoring_alloy_mimir_basic_auth_password | length > 0
    fail_msg: "Define the remote write URLs and basic auth passwords (encrypted group vars)."
    quiet: true
  when: monitoring_agent_package_state not in ['absent', 'skip']

- name: "Monitoring: Remove Alloy"
  when: monitoring_agent_package_state == 'absent'
  block:
    - name: "Monitoring: Uninstall alloy"
      become: true
      ansible.builtin.package:
        name: "{{ monitoring_agent_package_name }}"
        state: absent

    # Left behind by the package
    - name: "Monitoring: Remove alloy files"
      become: true
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ monitoring_agent_config_path | dirname }}"
        - "{{ monitoring_agent_data_path }}"

- name: "Monitoring: Configure Alloy"
  when: monitoring_agent_package_state not in ['absent', 'skip']
  block:
    - name: "Monitoring: Install alloy"
      become: true
      ansible.builtin.package:
        name: "{{ monitoring_agent_package }}"
        state: "{{ monitoring_agent_package_state }}"
        disable_gpg_check: true
      notify: "Monitoring: Restart Agent"

    - name: "Monitoring: Install acl"
      become: true
      ansible.builtin.package:
        name: acl
        state: present

    - name: "Monitoring: Add alloy user to extra groups"
      become: true
      ansible.builtin.user:
        name: alloy
        groups: "{{ monitoring_alloy_extra_groups }}"
        append: true
      when: monitoring_alloy_permissions_setup
      notify: "Monitoring: Restart Agent"

    - name: "Monitoring: Manage alloy config"
      become: true
      ansible.builtin.template:
        src: config.alloy.j2
        dest: "{{ monitoring_agent_config_path }}"
        owner: root
        group: alloy
        mode: "0640"
      notify: "Monitoring: Restart Agent"

    - name: "Monitoring: Manage service"
      become: true
      ansible.builtin.service:
        name: "{{ monitoring_agent_service_name }}"
        state: "{{ monitoring_agent_service_state }}"
        enabled: "{{ monitoring_agent_service_enabled }}"
