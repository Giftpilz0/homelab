---
argument_specs:
  main:
    short_description: Install the Flux CLI (flux) binary.
    options:
      fluxcli_bin_state:
        type: str
        required: false
        choices:
          - present
          - skip
        description: desired state of the flux binary.

      fluxcli_url:
        type: str
        required: false
        description: download URL for the flux binary.

      fluxcli_arch:
        type: str
        required: false
        description: target architecture (e.g. amd64, arm64).

      fluxcli_tag:
        type: str
        required: false
        description: release version tag.

      fluxcli_path:
        type: str
        required: false
        description: installation directory for the binary.
