---
argument_specs:
  main:
    short_description: Install the Helm package manager binary.
    options:
      helm_bin_state:
        type: str
        required: false
        choices:
          - present
          - skip
        description: desired state of the helm binary.

      helm_url:
        type: str
        required: false
        description: download URL for the helm binary.

      helm_arch:
        type: str
        required: false
        description: target architecture (e.g. amd64, arm64).

      helm_tag:
        type: str
        required: false
        description: release version tag.

      helm_path:
        type: str
        required: false
        description: installation directory for the binary.
