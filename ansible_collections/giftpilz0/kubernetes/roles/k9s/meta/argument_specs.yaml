---
argument_specs:
  main:
    short_description: Install the k9s terminal UI for Kubernetes.
    options:
      k9s_bin_state:
        type: str
        required: false
        choices:
          - present
          - skip
        description: desired state of the k9s binary.

      k9s_url:
        type: str
        required: false
        description: download URL for the k9s binary.

      k9s_arch:
        type: str
        required: false
        description: target architecture (e.g. amd64, arm64).

      k9s_tag:
        type: str
        required: false
        description: release version tag.

      k9s_path:
        type: str
        required: false
        description: installation directory for the binary.
