---
argument_specs:
  main:
    short_description: Install and configure HAProxy with HTTP and TCP backends.
    options:
      haproxy_service_name:
        type: str
        required: false
        description: systemd service unit name.

      haproxy_service_state:
        type: str
        required: false
        choices:
          - reloaded
          - restarted
          - started
          - stopped
        description: desired state of the haproxy service.

      haproxy_service_enabled:
        type: bool
        required: false
        description: whether the haproxy service is enabled at boot.

      haproxy_selinux_permissive:
        type: bool
        required: false
        description: set SELinux to permissive mode for haproxy.

      haproxy_package_state:
        type: str
        required: false
        choices:
          - present
          - absent
          - latest
        description: desired state of haproxy packages.

      haproxy_package:
        type: list
        elements: str
        required: false
        description: list of packages to install.

      haproxy_config_path:
        type: str
        required: false
        description: path to the haproxy configuration file.

      haproxy_config_ssl:
        type: bool
        required: false
        description: enable SSL/TLS termination.

      haproxy_config_force_https:
        type: bool
        required: false
        description: redirect HTTP to HTTPS.

      haproxy_config_maxconn:
        type: int
        required: false
        description: maximum concurrent connections.

      haproxy_config_http_apps:
        type: list
        elements: dict
        required: false
        options:
          name:
            type: str
            required: false
            description: application name.
          domain:
            type: str
            required: false
            description: frontend domain name.
          force_https:
            type: bool
            required: false
            description: redirect HTTP to HTTPS for this app.
          certificate:
            type: str
            required: false
            description: path to the SSL certificate file.
          servers:
            type: list
            elements: dict
            required: false
            options:
              name:
                type: str
                required: false
                description: backend server name.
              host:
                type: str
                required: false
                description: backend server address.
              port:
                type: int
                required: false
                description: backend server port.
        description: list of HTTP frontend/backend definitions.

      haproxy_config_tcp_apps:
        type: list
        elements: dict
        required: false
        options:
          name:
            type: str
            required: false
            description: application name.
          port:
            type: int
            required: false
            description: frontend listen port.
          servers:
            type: list
            elements: dict
            required: false
            options:
              name:
                type: str
                required: false
                description: backend server name.
              host:
                type: str
                required: false
                description: backend server address.
              port:
                type: int
                required: false
                description: backend server port.
        description: list of TCP frontend/backend definitions.
