---
argument_specs:
  main:
    short_description: Install and configure the NFS server and its exports.
    options:
      nfs_service_name:
        type: list
        elements: dict
        required: false
        options:
          name:
            type: str
            required: false
            description: systemd service unit name.
        description: list of NFS services to manage.

      nfs_service_state:
        type: str
        required: false
        choices:
          - reloaded
          - restarted
          - started
          - stopped
        description: desired state of NFS services.

      nfs_service_enabled:
        type: bool
        required: false
        description: whether NFS services are enabled at boot.

      nfs_package_state:
        type: str
        required: false
        choices:
          - present
          - absent
          - latest
        description: desired state of NFS packages.

      nfs_package:
        type: list
        elements: str
        required: false
        description: list of packages to install.

      nfs_exports_file:
        type: str
        required: false
        description: path to the exports file.

      nfs_exports:
        type: list
        elements: dict
        required: false
        options:
          path:
            type: str
            required: false
            description: exported directory path.
          host:
            type: str
            required: false
            description: allowed client host or CIDR.
          options:
            type: str
            required: false
            description: export options (e.g. rw,sync,no_root_squash).
          group:
            type: str
            required: false
            description: directory group owner.
          user:
            type: str
            required: false
            description: directory user owner.
          permissions:
            type: str
            required: false
            description: directory permissions (e.g. 0755).
        description: list of NFS exports to manage.

      nfs_exports_state:
        type: str
        required: false
        choices:
          - present
          - absent
          - skip
        description: desired state of export entries.

      nfs_firewalld_zone:
        type: str
        required: false
        description: firewall zone for NFS rules.

      nfs_firewalld_service:
        type: str
        required: false
        description: firewall service name.

      nfs_firewalld_state:
        type: str
        required: false
        choices:
          - present
          - absent
          - enabled
          - disabled
          - skip
        description: desired state of firewall rules.
