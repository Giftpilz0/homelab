---
argument_specs:
  main:
    short_description: Install and configure keepalived for a virtual IP (VRRP).
    options:
      keepalived_service_name:
        type: str
        required: false
        description: systemd service unit name.

      keepalived_service_state:
        type: str
        required: false
        choices:
          - reloaded
          - restarted
          - started
          - stopped
        description: desired state of the keepalived service.

      keepalived_service_enabled:
        type: bool
        required: false
        description: whether the keepalived service is enabled at boot.

      keepalived_package_state:
        type: str
        required: false
        choices:
          - present
          - absent
          - latest
        description: desired state of keepalived packages.

      keepalived_package:
        type: list
        elements: str
        required: false
        description: list of packages to install.

      keepalived_config_path:
        type: str
        required: false
        description: path to the keepalived configuration file.

      keepalived_config_virtual_ip:
        type: str
        required: false
        description: virtual IP address to manage.

      keepalived_config_interface:
        type: str
        required: false
        description: network interface for VRRP advertisements.

      keepalived_config_priority:
        type: int
        required: false
        description: VRRP priority (higher wins election).

      keepalived_config_virtual_router_id:
        type: int
        required: false
        description: VRRP virtual router ID.

      keepalived_config_vrrp_instance:
        type: str
        required: false
        description: VRRP instance name.

      keepalived_config_state:
        type: str
        required: false
        description: initial VRRP state (MASTER or BACKUP).
