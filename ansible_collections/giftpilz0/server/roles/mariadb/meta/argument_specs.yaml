---
argument_specs:
  main:
    short_description: Install and manage the MariaDB server, databases, and users.
    options:
      mariadb_service_name:
        type: str
        required: false
        description: systemd service unit name.

      mariadb_service_state:
        type: str
        required: false
        choices:
          - reloaded
          - restarted
          - started
          - stopped
        description: desired state of the mariadb service.

      mariadb_service_enabled:
        type: bool
        required: false
        description: whether the mariadb service is enabled at boot.

      mariadb_package_state:
        type: str
        required: false
        choices:
          - present
          - absent
          - latest
        description: desired state of mariadb packages.

      mariadb_package:
        type: list
        elements: str
        required: false
        description: list of packages to install.

      mariadb_database:
        type: str
        required: false
        description: database name to manage.

      mariadb_database_encoding:
        type: str
        required: false
        description: database character encoding (e.g. utf8mb4).

      mariadb_database_collation:
        type: str
        required: false
        description: database collation (e.g. utf8mb4_unicode_ci).

      mariadb_database_state:
        type: str
        required: false
        choices:
          - present
          - absent
          - skip
        description: desired state of the database.

      mariadb_user:
        type: str
        required: false
        description: database username.

      mariadb_user_password:
        type: str
        required: false
        description: database user password.

      mariadb_user_database:
        type: str
        required: false
        description: database to grant user access to.

      mariadb_user_privileges:
        type: str
        required: false
        description: SQL privileges string (e.g. ALL ON db.*).

      mariadb_user_state:
        type: str
        required: false
        choices:
          - present
          - absent
          - skip
        description: desired state of the database user.

      mariadb_firewalld_zone:
        type: str
        required: false
        description: firewall zone for mariadb rules.

      mariadb_firewalld_service:
        type: str
        required: false
        description: firewall service name.

      mariadb_firewalld_state:
        type: str
        required: false
        choices:
          - present
          - absent
          - enabled
          - disabled
          - skip
        description: desired state of firewall rules.
