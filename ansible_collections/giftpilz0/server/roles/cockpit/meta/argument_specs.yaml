---
argument_specs:
  main:
    short_description: Install and enable the Cockpit web console.
    options:
      cockpit_service_name:
        type: str
        required: false
        description: systemd service unit name.

      cockpit_service_state:
        type: str
        required: false
        choices:
          - reloaded
          - restarted
          - started
          - stopped
        description: desired state of the cockpit service.

      cockpit_service_enabled:
        type: bool
        required: false
        description: whether the cockpit service is enabled at boot.

      cockpit_package_state:
        type: str
        required: false
        choices:
          - present
          - absent
          - latest
        description: desired state of cockpit packages.

      cockpit_package:
        type: list
        elements: str
        required: false
        description: list of cockpit packages to install.

      cockpit_additional_package_state:
        type: str
        required: false
        choices:
          - present
          - absent
          - latest
          - skip
        description: desired state of additional cockpit packages.

      cockpit_additional_package:
        type: list
        elements: dict
        required: false
        options:
          package:
            type: str
            required: false
            description: package name.
          requirement:
            type: str
            required: false
            description: requirement package name.
          state:
            type: str
            required: false
            choices:
              - present
              - absent
              - latest
              - skip
            description: desired state of the package.
        description: list of additional cockpit packages with requirements.

      cockpit_firewalld_zone:
        type: str
        required: false
        description: firewall zone for cockpit rules.

      cockpit_firewalld_service:
        type: str
        required: false
        description: firewall service name.

      cockpit_firewalld_state:
        type: str
        required: false
        choices:
          - present
          - absent
          - enabled
          - disabled
          - skip
        description: desired state of firewall rules.
