---
######################################
### giftpilz0.container.opencloud

# renovate: datasource=docker depName=opencloudeu/opencloud-rolling
opencloud_version: "8.1.0"

opencloud_extra_dirs:
  - src: "{{ inventory_dir | dirname }}/host_vars/{{ inventory_hostname }}/assets/opencloud/themes"
    dest: "assets/themes"
    mount: "/var/lib/opencloud/web/assets/custom-themes"
  - src: "{{ inventory_dir | dirname }}/host_vars/{{ inventory_hostname }}/assets/opencloud/plugins"
    dest: "assets/apps"
    mount: "/var/lib/opencloud/web/assets/custom-apps"

opencloud_domain: "https://opencloud.nixpi.de"
opencloud_csp_oidc_origin: "https://login.nixpi.de"

opencloud_radicale_enabled: true

opencloud_collabora_enabled: true
opencloud_collabora_url: "https://collabora.nixpi.de"
opencloud_collabora_admin_password: "{{ opencloud_admin_password }}"
opencloud_collabora_home_mode: true

opencloud_environment_vars:
  IDM_ADMIN_PASSWORD: "{{ opencloud_admin_password }}"
  OPEN_CLOUD_LOG_LEVEL: "{{ opencloud_log_level }}"
  OC_URL: "{{ opencloud_domain }}"
  OC_CORS_ALLOW_ORIGINS: "{{ opencloud_domain }}"
  PROXY_TLS: false
  PROXY_CSP_CONFIG_FILE_LOCATION: "/etc/opencloud/csp.yaml"
  FRONTEND_ARCHIVER_MAX_SIZE: 68719476736
  THUMBNAILS_MAX_CONCURRENT_REQUESTS: 64
  FRONTEND_CHECK_FOR_UPDATES: false
  # External OIDC (Keycloak)
  OC_EXCLUDE_RUN_SERVICES: "idp"
  OC_OIDC_CLIENT_ID: "OpenCloudWeb"
  OC_OIDC_ISSUER: "https://login.nixpi.de/realms/nixpi"
  PROXY_AUTOPROVISION_ACCOUNTS: "true"
  PROXY_OIDC_REWRITE_WELLKNOWN: "true"
  PROXY_USER_CS3_CLAIM: "username"
  PROXY_USER_OIDC_CLAIM: "preferred_username"
  PROXY_ROLE_ASSIGNMENT_DRIVER: "oidc"
  GRAPH_ASSIGN_DEFAULT_USER_ROLE: "false"
  GRAPH_USERNAME_MATCH: "none"
  WEB_OPTION_ACCOUNT_EDIT_LINK_HREF: "https://login.nixpi.de/realms/nixpi/account"
  SETTINGS_SETUP_DEFAULT_ASSIGNMENTS: "false"

######################################
### giftpilz0.container.navidrome

# renovate: datasource=docker depName=deluan/navidrome
navidrome_version: "0.64.2"

navidrome_webui_enabled: true
# renovate: datasource=docker depName=ghcr.io/giftpilz0/musiclibrary
navidrome_webui_version: "edge"
navidrome_webui_environment_vars:
  MUSIC_LIBRARY_ROOT: "/music"
  MUSIC_LIBRARY_NAVIDROME_LIBRARY_PATH: "/music/transcoded"
  BASE_URL: "https://music.nixpi.de"
  # Enables "Scan" (AcoustID fingerprints)
  MUSIC_LIBRARY_ACOUSTID_API_KEY: "{{ navidrome_webui_acoustid_api_key }}"
  MUSIC_LIBRARY_NAVIDROME_USERNAME: navidrome
  MUSIC_LIBRARY_NAVIDROME_PASSWORD: "{{ navidrome_admin_password }}"
  MUSIC_LIBRARY_NAVIDROME_URL: "http://127.0.0.1:4533"

######################################
### giftpilz0.container.suwayomi

# renovate: datasource=docker depName=ghcr.io/suwayomi/suwayomi-server
suwayomi_version: "v2.4.2435"
# renovate: datasource=docker depName=ghcr.io/thephaseless/byparr
suwayomi_flaresolverr_version: "3.0.4"

######################################
### giftpilz0.container.traefik

traefik_networks:
  - opencloud
  - navidrome
  - suwayomi

traefik_plugins:
  traefik-oidc-auth:
    moduleName: "github.com/sevensolutions/traefik-oidc-auth"
    version: "v0.21.0"

traefik_custom_middlewares:
  suwayomi-oidc:
    plugin:
      traefik-oidc-auth:
        Secret: "{{ suwayomi_oidc_session_secret }}"
        Provider:
          Url: "https://login.nixpi.de/realms/nixpi"
          ClientId: "suwayomi"
          ClientSecret: "{{ suwayomi_oidc_client_secret }}"
          UsePkce: true
        Scopes:
          - "openid"
          - "profile"
          - "email"
        ValidPostLoginRedirectUris:
          - "https://suwayomi.nixpi.de/"
        ValidPostLogoutRedirectUris:
          - "https://suwayomi.nixpi.de/"
  music-webui-oidc:
    plugin:
      traefik-oidc-auth:
        Secret: "{{ music_webui_oidc_session_secret }}"
        Provider:
          Url: "https://login.nixpi.de/realms/nixpi"
          ClientId: "music-webui"
          ClientSecret: "{{ music_webui_oidc_client_secret }}"
          UsePkce: true
        Scopes:
          - "openid"
          - "profile"
          - "email"
        ValidPostLoginRedirectUris:
          - "https://music.nixpi.de/"
        ValidPostLogoutRedirectUris:
          - "https://music.nixpi.de/"

traefik_transport_timeouts_enabled: true

traefik_http_services:
  - name: opencloud
    domain: opencloud.nixpi.de
    rule: "Host(`opencloud.nixpi.de`)"
    servers:
      - url: "http://opencloud-pod:9200"
    tls_enabled: true
    acme_enabled: true
    large_downloads: true
  - name: collabora
    domain: collabora.nixpi.de
    rule: "Host(`collabora.nixpi.de`)"
    servers:
      - url: "https://collabora-pod:9980"
    tls_enabled: true
    acme_enabled: true
    insecure_skip_verify: true
  - name: navidrome
    domain: navidrome.nixpi.de
    rule: "Host(`navidrome.nixpi.de`)"
    servers:
      - url: "http://navidrome-pod:4533"
    tls_enabled: true
    acme_enabled: true
  - name: music-webui
    domain: music.nixpi.de
    rule: "Host(`music.nixpi.de`)"
    servers:
      - url: "http://navidrome-pod:8080"
    tls_enabled: true
    acme_enabled: true
    middlewares:
      - "music-webui-oidc@file"
  - name: suwayomi
    domain: suwayomi.nixpi.de
    rule: "Host(`suwayomi.nixpi.de`)"
    servers:
      - url: "http://suwayomi-pod:4567"
    tls_enabled: true
    acme_enabled: true
    large_downloads: true
    middlewares:
      - "suwayomi-oidc@file"
