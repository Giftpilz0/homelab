---
######################################
### giftpilz0.general.firewalld

firewalld_zones_define:
  - zone: server
    source: 192.168.60.0/24
  - zone: server-kubernetes
    source: 192.168.65.0/24
  - zone: server-lb
    source: 192.168.70.0/24
  - zone: clients
    source: 192.168.10.0/24
  - zone: clients
    source: 192.168.15.0/24
  - zone: internet
    source: 0.0.0.0/0

firewalld_rules_services:
  - service: ssh
    zone: clients
    state: enabled
  - service: http
    zone: clients
    state: enabled
  - service: https
    zone: clients
    state: enabled
  - service: http3
    zone: clients
    state: enabled
  - service: dns
    zone: clients
    state: enabled
  - service: http
    zone: server
    state: enabled
  - service: https
    zone: server
    state: enabled
  - service: http3
    zone: server
    state: enabled
  - service: dns
    zone: server
    state: enabled
  - service: dns
    zone: internet
    state: enabled
  - service: http
    zone: internet
    state: enabled
  - service: https
    zone: internet
    state: enabled
  - service: http3
    zone: internet
    state: enabled
