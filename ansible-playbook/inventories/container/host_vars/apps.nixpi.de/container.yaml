---
######################################
### giftpilz0.container.misc

misc_version: "latest"
misc_commit: "db16ab7ca40f6e1e98e6e7a3947fb9e2aa04f527"

######################################
### giftpilz0.container.market_brief

market_brief_data_repo: "ssh://git@ssh.github.com:443/Giftpilz0/market-watch-data.git"

######################################
### giftpilz0.container.kartei

# renovate: datasource=docker depName=ghcr.io/giftpilz0/kartei
kartei_version: "edge"

kartei_base_url: "https://kartei.nixpi.de"
kartei_oidc_issuer_url: "https://login.nixpi.de/realms/nixpi"

######################################
### giftpilz0.container.dashboard

# renovate: datasource=docker depName=nginx
dashboard_version: "1.31.8-alpine"

dashboard_title: "nixpi.de"
dashboard_logo: icons/nixpi.svg

dashboard_extra_dirs:
  - src: "{{ inventory_dir | dirname }}/host_vars/{{ inventory_hostname }}/assets/dashboard/icons"
    dest: "site/icons"

dashboard_groups:
  - name: Media
    links:
      - name: Navidrome
        url: https://navidrome.nixpi.de
        icon: icons/navidrome.svg
      - name: Music
        url: https://music.nixpi.de
        icon: icons/navidrome.svg
      - name: Suwayomi
        url: https://suwayomi.nixpi.de
        icon: icons/suwayomi.svg
  - name: Files & passwords
    links:
      - name: OpenCloud
        url: https://opencloud.nixpi.de
        icon: icons/opencloud.svg
      - name: Vaultwarden
        url: https://vaultwarden.nixpi.de
        icon: icons/vaultwarden.svg
  - name: Apps
    links:
      - name: Kartei
        url: https://kartei.nixpi.de
        icon: icons/kartei.svg
      - name: Forgejo
        url: https://forgejo.nixpi.de
        icon: icons/forgejo.svg
      - name: Home Assistant
        url: https://homeassistant.nixpi.de
        icon: icons/home-assistant.svg
      - name: Bumper
        url: https://bumper.nixpi.de:8443/
        icon: icons/bumper.ico
  - name: System
    links:
      - name: Keycloak
        url: https://login.nixpi.de
        icon: icons/keycloak.svg
      - name: Beszel
        url: https://monitoring.nixpi.de
        icon: icons/beszel.svg
      - name: Gatus
        url: https://status.nixpi.de
        icon: icons/gatus.svg
      - name: VictoriaLogs
        url: https://logs.nixpi.de/select/vmui/
        icon: icons/victorialogs.svg
      - name: Proxmox
        url: https://pve.nixpi.de:8006
        icon: icons/proxmox.svg
      - name: UniFi
        url: https://unifi.nixpi.de
        icon: icons/unifi.svg

######################################
### giftpilz0.container.traefik

traefik_networks:
  - kartei
  - dashboard

traefik_http_services:
  - name: dashboard
    domain: nixpi.de
    rule: "Host(`nixpi.de`)"
    servers:
      - url: "http://dashboard-pod:80"
    tls_enabled: true
    acme_enabled: true
  - name: kartei
    domain: kartei.nixpi.de
    rule: "Host(`kartei.nixpi.de`)"
    servers:
      - url: "http://kartei-pod:8080"
    tls_enabled: true
    acme_enabled: true
    # Package imports and exports can be large
    large_downloads: true
    health_check:
      path: "/healthz"
      interval: "30s"

######################################
### giftpilz0.misc.cfdyndns

cfdyndns_update_hostnames:
  - acme.nixpi.de
  - nixpi.de
