---
######################################
### giftpilz0.container.postgresql (provisioned by giftpilz0.container.keycloak)

postgresql_port_map_enabled: true
# Legacy: the app user is the superuser
postgresql_admin_database: "keycloak"
postgresql_admin_user: "keycloak"
postgresql_admin_password: "{{ keycloak_db_password }}"
postgresql_databases:
  - name: "keycloak"
    owner: "keycloak"

# renovate: datasource=docker depName=postgres
postgresql_version: "18.6-alpine"

######################################
### giftpilz0.container.keycloak

# renovate: datasource=docker depName=quay.io/keycloak/keycloak
keycloak_version: "26.8.1"

keycloak_extra_files:
  - src: "{{ inventory_dir | dirname }}/host_vars/{{ inventory_hostname }}/assets/keycloak/keycloak-theme.jar"
    dest: "config/keycloak-theme.jar"
    mount: "/opt/keycloak/providers/keycloak-theme.jar"

######################################
### giftpilz0.container.traefik

traefik_networks:
  - keycloak

traefik_http_services:
  - name: keycloak
    domain: login.nixpi.de
    rule: "Host(`login.nixpi.de`)"
    servers:
      - url: "http://keycloak-pod:8080"
    tls_enabled: true
    acme_enabled: true
