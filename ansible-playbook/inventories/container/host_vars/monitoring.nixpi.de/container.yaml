---
######################################
### giftpilz0.container.beszel

# renovate: datasource=docker depName=henrygd/beszel
beszel_version: "0.21.1"

beszel_app_url: "https://monitoring.nixpi.de"
beszel_environment_vars:
  APP_URL: "{{ beszel_app_url }}"
  DISABLE_SSH: "true"
  # Accounts for Keycloak users
  USER_CREATION: "true"

######################################
### giftpilz0.container.gatus

# renovate: datasource=docker depName=twinproduction/gatus
gatus_version: "v5.38.0"

gatus_url: "https://status.nixpi.de"
gatus_oidc_enabled: true
gatus_oidc_issuer_url: "https://login.nixpi.de/realms/nixpi"

# Websocket listener, checked below via plain MQTT
gatus_traefik_exclude:
  - mqtt-websocket
  - victorialogs-ingest

# traefik-oidc-auth answers non-browser requests with 401
gatus_traefik_overrides:
  music-webui:
    conditions:
      - "[STATUS] == 401"
      - "[CERTIFICATE_EXPIRATION] > 336h"
  suwayomi:
    conditions:
      - "[STATUS] == 401"
      - "[CERTIFICATE_EXPIRATION] > 336h"
  victorialogs:
    conditions:
      - "[STATUS] == 401"
      - "[CERTIFICATE_EXPIRATION] > 336h"

gatus_endpoints:
  - name: mqtt
    group: smarthome
    url: "tcp://mqtt.nixpi.de:1883"
    conditions:
      - "[CONNECTED] == true"
  # 503 when a market watch job or Claude run is missed or failed
  - name: market-watch-jobs
    group: apps
    url: "https://finance.nixpi.de/api/health"
    interval: 5m

######################################
### giftpilz0.container.victorialogs

# renovate: datasource=docker depName=victoriametrics/victoria-logs
victorialogs_version: "v1.54.0"

victorialogs_syslog_enabled: true
victorialogs_syslog_timezone: "Europe/Berlin"

victorialogs_port_map_enabled: true
victorialogs_bind_ip: "{{ ansible_facts['default_ipv4']['address'] }}"
victorialogs_port_map:
  - "5514:5514/tcp"
  - "5514:5514/udp"

######################################
### giftpilz0.container.traefik

traefik_networks:
  - beszel
  - gatus
  - victorialogs

traefik_plugins:
  traefik-oidc-auth:
    moduleName: "github.com/sevensolutions/traefik-oidc-auth"
    # renovate: datasource=github-releases depName=sevensolutions/traefik-oidc-auth
    version: "v0.24.0"

traefik_custom_middlewares:
  victorialogs-oidc:
    plugin:
      traefik-oidc-auth:
        Secret: "{{ victorialogs_oidc_session_secret }}"
        Provider:
          Url: "https://login.nixpi.de/realms/nixpi"
          ClientId: "victorialogs"
          ClientSecret: "{{ victorialogs_oidc_client_secret }}"
          UsePkce: true
        Scopes:
          - "openid"
          - "profile"
          - "email"
        ValidPostLoginRedirectUris:
          - "https://logs.nixpi.de/"
        ValidPostLogoutRedirectUris:
          - "https://logs.nixpi.de/"

traefik_http_services:
  - name: victorialogs
    domain: logs.nixpi.de
    rule: "Host(`logs.nixpi.de`)"
    servers:
      - url: "http://victorialogs-pod:9428"
    tls_enabled: true
    acme_enabled: true
    health_check:
      path: "/health"
      interval: "30s"
    middlewares:
      - "victorialogs-oidc@file"
  # No auth: agents can't log in through Keycloak
  - name: victorialogs-ingest
    domain: logs.nixpi.de
    rule: "Host(`logs.nixpi.de`) && PathPrefix(`/insert`)"
    servers:
      - url: "http://victorialogs-pod:9428"
    tls_enabled: true
    acme_enabled: true
  - name: beszel
    domain: monitoring.nixpi.de
    rule: "Host(`monitoring.nixpi.de`)"
    servers:
      - url: "http://beszel-pod:8090"
    tls_enabled: true
    acme_enabled: true
  - name: gatus
    domain: status.nixpi.de
    rule: "Host(`status.nixpi.de`)"
    servers:
      - url: "http://gatus-pod:8080"
    tls_enabled: true
    acme_enabled: true
