---
######################################
### giftpilz0.general.firewalld

# Beszel agents of pve and acme
firewalld_zones_define_host:
  - zone: management
    source: 192.168.50.0/24
  - zone: server-dmz
    source: 192.168.55.0/24

firewalld_rules_services_host:
  - service: https
    zone: management
  - service: https
    zone: server-dmz

# VictoriaLogs syslog
firewalld_rules_ports_host:
  - port: 5514
    protocol: tcp
    zone: clients
  - port: 5514
    protocol: udp
    zone: clients
  - port: 5514
    protocol: tcp
    zone: server
  - port: 5514
    protocol: udp
    zone: server
  - port: 5514
    protocol: tcp
    zone: management
  - port: 5514
    protocol: udp
    zone: management
