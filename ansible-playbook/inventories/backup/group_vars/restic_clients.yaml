---
######################################
### giftpilz0.misc.restic

restic_mode: client

restic_server_host: pve.nixpi.de
# restic_server_secret (encrypted group vars) only stays on the controller
restic_server_password: "{{ (restic_server_secret ~ '/' ~ inventory_hostname) | hash('sha256') }}"

restic_stop_units_user: container
# Pods with databases in their volumes, see host_vars
backup_stop_units: []

restic_repositories:
  - name: podman-volumes
    password: "{{ restic_repo_password }}"
    backup_paths:
      - /home/container/.local/share/containers/storage/volumes
    stop_units: "{{ backup_stop_units }}"
    schedule: "*-*-* 02:00:00"

  - name: podman-configs
    password: "{{ restic_repo_password }}"
    backup_paths:
      - /home/container/.config/containers/systemd
    schedule: "*-*-* 01:00:00"
