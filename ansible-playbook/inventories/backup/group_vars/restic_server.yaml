---
######################################
### giftpilz0.general.user

user:
  - user_username: "backup"
    user_groups:
      - backup
    user_home: true
    user_shell: "/bin/bash"
    user_comment: "backup"
    user_install_key_to_targets: true
    user_sudo_pwless: false
    user_state: present
    user_password: "!"
    user_pub:
      - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOAhl7NUVzPjYfk/rB+dS0i6wDPkB5EtlZSfVwGdrWsg"

######################################
### giftpilz0.misc.restic

restic_mode: server

restic_user: backup
restic_user_home: /home/backup

restic_server_repo_base: /media/data/backup/restic

######################################
### giftpilz0.misc.snapper

snapper_configs:
  - name: backup
    path: /media/data/backup
    allow_users: "{{ restic_user }}"
    sync_acl: "yes"
    timeline_create: "yes"
    timeline_cleanup: "yes"
    timeline_min_age: 3600
    timeline_limit_hourly: 5
    timeline_limit_daily: 7
    timeline_limit_weekly: 4
    timeline_limit_monthly: 6
    timeline_limit_yearly: 3
    number_cleanup: "yes"

snapper_enable_timeline_timer: true
snapper_enable_cleanup_timer: true
snapper_add_to_fstab: true
