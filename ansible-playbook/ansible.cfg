[defaults]
# giftpilz0.* collections are used from the repo (..), external ones are
# installed into .ansible/collections by run.sh.
collections_path = ..:./.ansible/collections
# Decrypt *.sops.yaml files in group_vars/host_vars in memory at runtime.
vars_plugins_enabled = host_group_vars,community.sops.sops
interpreter_python = auto_silent
stdout_callback = ansible.builtin.default
callback_result_format = yaml

[ssh_connection]
pipelining = True
